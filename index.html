<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Village Talk</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Grand+Hotel&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--red:#ff3040}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:'Space Grotesk',sans-serif}
#app{max-width:520px;margin:auto;background:#000;min-height:100vh;padding-bottom:90px;border-left:1px solid #111;border-right:1px solid #111}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;position:sticky;top:0;background:#000;z-index:100;border-bottom:1px solid #111}
.logo{font-family:'Grand Hotel',cursive;font-size:28px}.logo span{color:var(--red)}
.icon{width:36px;height:36px;display:grid;place-items:center;background:#151515;border:1px solid #222;border-radius:10px;cursor:pointer}
.searchBar{margin:10px 12px;display:flex;gap:8px;align-items:center;background:#121212;border:1px solid #222;border-radius:12px;padding:8px 12px}
.searchBar input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.card{background:#121212;border:1px solid #222;border-radius:16px;margin:10px;padding:12px}
input,select,textarea{width:100%;padding:12px;background:#0f0f0f;border:1px solid #2a2a2a;color:#fff;border-radius:10px;margin:5px 0}
button{width:100%;padding:12px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:700;cursor:pointer}button.red{background:var(--red);color:#fff}button.dark{background:#1e1e1e;color:#fff;border:1px solid #333}
.tab{display:none}.tab.active{display:block}
.feed-post{background:#121212;border:1px solid #222;border-radius:16px;margin:10px;overflow:hidden}
.feed-head{display:flex;gap:10px;align-items:center;padding:10px}.feed-head img{width:36px;height:36px;border-radius:8px}
.feed-img{width:100%;max-height:560px;object-fit:cover}
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:94%;max-width:520px;background:rgba(18,18,18,.96);border:1px solid #222;border-radius:18px;display:flex;justify-content:space-around;padding:8px;z-index:999}
.bottom i{font-size:20px;color:#777;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;cursor:pointer}.bottom i.active{color:#fff;background:#222}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:1000;padding:16px}.modal.active{display:grid}.modal-box{background:#121212;border:1px solid #333;border-radius:18px;max-width:480px;width:100%;padding:16px;max-height:92vh;overflow-y:auto}
.id-badge{background:linear-gradient(45deg,#ff3040,#962fbf);padding:12px;border-radius:12px;text-align:center;margin:10px 0;font-weight:700}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a1a}.switch{width:44px;height:26px;background:#333;border-radius:20px;position:relative;cursor:pointer}.switch.on{background:var(--red)}.switch::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}.switch.on::after{left:21px}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="icon" onclick="openModal('createModal')"><i class="fa-solid fa-plus"></i></div><div class="logo">World Village <span>Talk</span></div><div class="icon" onclick="switchTab('dms')"><i class="fa-solid fa-paper-plane"></i></div></div>
<div class="searchBar"><i class="fa-solid fa-magnifying-glass" style="color:#777"></i><input id="searchInput" placeholder="Search village, user, #hashtag" oninput="doSearch()"></div>

<div id="loginBox" class="card">
<h3 style="color:var(--red);margin:0 0 10px 0">WORLD VILLAGE LOGIN</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
<button onclick="showLoginType('otp')" id="btn_otp" class="red" style="padding:8px;font-size:12px">Real OTP</button>
<button onclick="showLoginType('pass')" id="btn_pass" class="dark" style="padding:8px;font-size:12px">Village ID + Password</button>
</div>

<div id="otpLogin">
<div id="s1"><input id="phone" placeholder="+919876543210"><div id="recaptcha"></div><button class="red" onclick="sendRealOTP()">SEND REAL OTP ON SMS</button><div style="font-size:11px;color:#888;text-align:center;margin-top:6px">Real OTP SMS notification pe ayega</div></div>
<div id="s2" style="display:none;margin-top:10px"><input id="otpInput" placeholder="Enter OTP from SMS"><button onclick="verifyRealOTP()">VERIFY REAL OTP</button><div id="otpStatus" style="font-size:11px;color:#0f0;margin-top:6px"></div></div>
</div>

<div id="passLogin" style="display:none">
<input id="loginUser" placeholder="Village ID"><input id="loginPass" type="password" placeholder="Password">
<button class="red" onclick="loginWithPass()">LOGIN</button>
<span style="font-size:12px;color:#888;cursor:pointer" onclick="openModal('forgotModal')">Forgot Password?</span>
</div>

<div id="s3" style="display:none;border:1.5px solid #0f0;padding:12px;border-radius:14px;background:#001a00;margin-top:10px">
<h4 style="margin:0 0 8px 0;color:#0f0">Create Your Village ID</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="fullName" placeholder="Full Name"><input id="username" placeholder="Village ID"></div>
<input id="mobileShow" disabled>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="password" type="password" placeholder="Create Password"><input id="cpassword" type="password" placeholder="Confirm"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="gender"><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option></select><select id="country"><option value="">Country</option><option>India</option><option>Russia</option><option>USA</option><option>Brazil</option><option>Nepal</option></select></div>
<textarea id="bio" rows="2" placeholder="Bio"></textarea><input type="file" id="avatarFile" accept="image/*">
<div style="background:#000;border:1px solid #222;border-radius:10px;padding:8px;margin-top:8px">
<b style="font-size:11px;color:var(--red)">PRIVACY</b>
<div class="toggle"><span>Profile Public</span><div class="switch on" id="sw_profile" onclick="this.classList.toggle('on')"></div></div>
<div class="toggle"><span>Mobile Private</span><div class="switch" id="sw_mobile" onclick="this.classList.toggle('on')"></div></div>
<div class="toggle"><span>Bio Public</span><div class="switch on" id="sw_bio" onclick="this.classList.toggle('on')"></div></div>
</div>
<button class="red" onclick="createProfile()" style="margin-top:10px">CREATE ID</button>
</div>
<div id="idCreated" style="display:none" class="id-badge"></div>
</div>

<div id="feed" class="tab active">
<div class="card" style="display:flex;gap:10px;align-items:center"><img id="feedMyPic" src="https://i.pravatar.cc/150?u=you" style="width:36px;height:36px;border-radius:8px"><button onclick="openModal('createModal')" class="dark" style="flex:1;margin:0;text-align:left;color:#888">Share your village? Pehli post tu dal</button></div>
<div id="feedPosts"></div><div id="searchResults" style="display:none"></div>
</div>
<div id="explore" class="tab"><div id="exploreGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px"></div></div>
<div id="reels" class="tab"><div id="reelsList"></div></div>
<div id="dms" class="tab"><div class="card"><b>Village Chat</b><div style="display:flex;gap:6px;margin-top:8px"><input id="dmUser" placeholder="Village ID"><button onclick="openDM()" style="width:auto">Open</button></div><div id="dmList"></div></div><div class="card"><div id="dmHead">Select village</div><div id="dmChatArea" style="height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:4px"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="dmMsg" placeholder="Message" style="flex:1"><button onclick="sendDM()" style="width:auto" class="red">Send</button></div></div></div>
<div id="profileTab" class="tab"><div id="myProfileCard" class="card"></div></div>

<div class="bottom">
<i class="fa-solid fa-house active" id="nav-feed" onclick="switchTab('feed')"></i>
<i class="fa-solid fa-compass" id="nav-explore" onclick="switchTab('explore')"></i>
<i class="fa-solid fa-square-plus" onclick="openModal('createModal')"></i>
<i class="fa-solid fa-film" id="nav-reels" onclick="switchTab('reels')"></i>
<i class="fa-solid fa-user" id="nav-profile" onclick="openProfile()"></i>
</div>
</div>

<div class="modal" id="createModal"><div class="modal-box"><h3>Create Post - Pehli Post Tu Dal</h3><input type="file" id="createFile" accept="image/*,video/*"><select id="createType"><option value="post">Feed</option><option value="story">Moment 24h</option><option value="reel">Clip</option></select><textarea id="createCaption" rows="3" placeholder="Caption #village"></textarea><button class="red" onclick="doCreate()">Post Now</button><button class="dark" onclick="closeModal('createModal')">Close</button></div></div>
<div class="modal" id="forgotModal"><div class="modal-box"><h3>Forgot Password</h3><input id="forgotUser" placeholder="Village ID"><div id="forgotRes" style="margin-top:8px;color:#0f0"></div><button class="red" onclick="forgotPass()">Get OTP</button><button class="dark" onclick="closeModal('forgotModal')">Close</button></div></div>

<script>
const _cfg="eyJhcGlLZXkiOiJBSXphU3lBRTBncEh6Y0ZsV3RKc2g4TDZQUG9iSnJRZDJFaE1mSjAiLCJhdXRoRG9tYWluIjoidGhlcmVkZXllLXZpbGxhZ2UuZmlyZWJhc2VhcHAuY29tIiwiZGF0YWJhc2VVUkwiOiJodHRwczovL3RoZXJlZGV5ZS12aWxsYWdlLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbSIsInByb2plY3RJZCI6InRoZXJlZGV5ZS12aWxsYWdlIiwic3RvcmFnZUJ1Y2tldCI6InRoZXJlZGV5ZS12aWxsYWdlLmZpcmViYXNlc3RvcmFnZS5hcHAiLCJtZXNzYWdpbmdTZW5kZXJJZCI6IjEwMDk1Mzk5NzQ5ODYiLCJhcHBJZCI6IjE6MTAwOTUzOTk3NDk4Njp3ZWI6Y2JmODk3ZjI0YTkyMzM5ZGQxZTNiMyJ9";
firebase.initializeApp(JSON.parse(atob(_cfg))); const db=firebase.database(); const auth=firebase.auth();
let confirmationResult=null, verifiedPhone="", me=null, dmTarget=null;
let saved=localStorage.getItem('village_user_final'); if(saved){ me=JSON.parse(saved); document.getElementById('loginBox').style.display='none'; initApp(); showIdCreated(); }
function showLoginType(t){ document.getElementById('otpLogin').style.display=t==='otp'?'block':'none'; document.getElementById('passLogin').style.display=t==='pass'?'block':'none'; document.getElementById('btn_otp').className=t==='otp'?'red':'dark'; document.getElementById('btn_pass').className=t==='pass'?'red':'dark'; }
function sendRealOTP(){
  let phone=document.getElementById('phone').value.trim(); if(phone.length<10){alert('Number daal +91 ke saath');return;}
  if(!phone.startsWith('+')) phone='+91'+phone.replace(/^0+/,''); verifiedPhone=phone; document.getElementById('mobileShow').value=phone;
  if(!window.recaptchaVerifier){ window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha',{size:'invisible'}); }
  auth.signInWithPhoneNumber(phone, window.recaptchaVerifier).then(r=>{ confirmationResult=r; document.getElementById('s2').style.display='block'; document.getElementById('otpStatus').innerText='✅ OTP sent to '+phone+' - SMS dekho'; alert('Real OTP bheja '+phone); }).catch(e=>{ alert('Error: '+e.message); window.recaptchaVerifier=null; });
}
function verifyRealOTP(){
  let otp=document.getElementById('otpInput').value.trim(); if(!confirmationResult){alert('Pehle OTP bhejo');return;}
  confirmationResult.confirm(otp).then(()=>{ document.getElementById('s1').style.display='none'; document.getElementById('s2').style.display='none'; document.getElementById('s3').style.display='block'; alert('✅ OTP Verified! ID banao'); }).catch(()=>{ alert('Galat OTP'); });
}
function createProfile(){
 let fn=document.getElementById('fullName').value.trim(), u=document.getElementById('username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,''), pass=document.getElementById('password').value.trim(), cpass=document.getElementById('cpassword').value.trim(), gen=document.getElementById('gender').value, cou=document.getElementById('country').value, bio=document.getElementById('bio').value.trim();
 if(!fn||!u||!verifiedPhone||!pass||!gen||!cou){alert('Sab bharo');return;} if(pass!==cpass){alert('Password match nahi');return;}
 let file=document.getElementById('avatarFile').files[0]; let pic=file?URL.createObjectURL(file):'https://i.pravatar.cc/150?u='+u;
 me={fullName:fn, username:u, mobile:verifiedPhone, password:pass, gender:gen, country:cou, bio:bio, pic:pic, time:Date.now(), posts:0, privacy:{profile:document.getElementById('sw_profile').classList.contains('on'), mobile:document.getElementById('sw_mobile').classList.contains('on'), bio:document.getElementById('sw_bio').classList.contains('on')}};
 localStorage.setItem('village_user_final',JSON.stringify(me)); localStorage.setItem('village_pass_'+u,pass); db.ref('profiles/'+u).set(me); document.getElementById('loginBox').style.display='none'; initApp(); showIdCreated();
}
function showIdCreated(){ let b=document.getElementById('idCreated'); b.style.display='block'; b.innerHTML=`✅ ID Created - Real OTP Verified<br><span style="font-size:20px">@${me.username}</span><br>${me.fullName} • ${me.mobile}`; }
function loginWithPass(){ let u=document.getElementById('loginUser').value.trim().toLowerCase(), p=document.getElementById('loginPass').value.trim(); db.ref('profiles/'+u).once('value',s=>{ let d=s.val(); if(d&&d.password===p){ me=d; localStorage.setItem('village_user_final',JSON.stringify(me)); document.getElementById('loginBox').style.display='none'; initApp(); showIdCreated(); } else alert('Wrong ID or Password'); }); }
function forgotPass(){ let u=document.getElementById('forgotUser').value.trim(); let otp=Math.floor(100000+Math.random()*900000); document.getElementById('forgotRes').innerHTML='Reset OTP for @'+u+': <b>'+otp+'</b>'; }
function initApp(){ loadFeed(); loadDMList(); }
function switchTab(t){ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.getElementById(t).classList.add('active'); document.querySelectorAll('.bottom i').forEach(i=>i.classList.remove('active')); let n=document.getElementById('nav-'+t); if(n) n.classList.add('active'); if(t==='profile') openProfile(); }
function openModal(id){ document.getElementById(id).classList.add('active'); } function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function openProfile(){ switchTab('profileTab'); if(!me) return; let p=me.privacy||{}; document.getElementById('myProfileCard').innerHTML=`<div style="text-align:center"><div style="width:90px;height:90px;margin:auto;background:#111;border-radius:14px;overflow:hidden"><img src="${me.pic}" style="width:100%;height:100%;object-fit:cover"></div><b style="display:block;margin-top:8px">${me.fullName}</b>@${me.username}<div style="margin-top:6px"><span style="background:linear-gradient(45deg,#ff3040,#962fbf);padding:4px 10px;border-radius:20px;font-size:11px">Village ID: @${me.username} - Real OTP Verified</span></div></div><div style="font-size:13px;background:#000;border:1px solid #222;border-radius:12px;padding:10px;margin-top:10px"><b>Name:</b> ${me.fullName}<br><b>ID:</b> @${me.username}<br><b>Mobile:</b> ${p.mobile?me.mobile:'🔒 Private'}<br><b>Bio:</b> ${p.bio?me.bio:'🔒 Private'}<br><b>Country:</b> ${me.country}<br><b>Created:</b> ${new Date(me.time).toLocaleDateString()}</div><button class="dark" onclick="editProfile()" style="margin-top:10px">Edit</button><button class="red" onclick="logout()" style="margin-top:8px">Logout - ID Safe</button>`; }
function logout(){ if(confirm('Logout? ID safe rahegi')){ localStorage.removeItem('village_user_final'); location.reload(); } }
function editProfile(){ let bio=prompt('New Bio:',me.bio)||me.bio; me.bio=bio; localStorage.setItem('village_user_final',JSON.stringify(me)); db.ref('profiles/'+me.username).set(me); openProfile(); }
function doCreate(){ let f=document.getElementById('createFile').files[0]; let type=document.getElementById('createType').value; let cap=document.getElementById('createCaption').value.trim(); if(!f&&!cap){alert('Photo ya caption');return;} let url=f?URL.createObjectURL(f):'https://picsum.photos/500/500?random='+Date.now(); if(type==='post'){ db.ref('posts').push({user:me.username,fullName:me.fullName,pic:me.pic,img:url,caption:cap,time:Date.now()}); me.posts=(me.posts||0)+1; localStorage.setItem('village_user_final',JSON.stringify(me)); } if(type==='story') db.ref('stories/'+me.username).set({pic:url,time:Date.now()}); if(type==='reel') db.ref('reels').push({user:me.username,pic:me.pic,video:url,caption:cap,time:Date.now()}); closeModal('createModal'); alert('Post Live!'); switchTab('feed'); }
function loadFeed(){ db.ref('posts').limitToLast(50).on('child_added',s=>{ let p=s.val(); let div=document.createElement('div'); div.className='feed-post'; div.innerHTML=`<div class="feed-head"><img src="${p.pic}"><div><b>${p.fullName||p.user}</b><div style="font-size:11px;color:#888">@${p.user}</div></div></div><img src="${p.img}" class="feed-img"><div style="padding:10px"><b>@${p.user}</b> ${p.caption||''}<br><span style="color:#666;font-size:11px">${new Date(p.time).toLocaleString()}</span></div>`; document.getElementById('feedPosts').prepend(div); }); }
function doSearch(){ let q=document.getElementById('searchInput').value.toLowerCase().trim(); if(!q){ document.getElementById('feedPosts').style.display='block'; document.getElementById('searchResults').style.display='none'; return; } document.getElementById('feedPosts').style.display='none'; document.getElementById('searchResults').style.display='block'; db.ref('posts').once('value',s=>{ let all=s.val()||{}, h=''; Object.values(all).forEach(p=>{ if((p.caption||'').toLowerCase().includes(q)||p.user.toLowerCase().includes(q)) h+=`<div class="feed-post"><div class="feed-head"><img src="${p.pic}"><b>@${p.user}</b></div><img src="${p.img}" class="feed-img"><div style="padding:10px">${p.caption}</div></div>`; }); document.getElementById('searchResults').innerHTML=h||'<div class="card">No results</div>'; }); }
function loadDMList(){ db.ref('profiles').on('value',s=>{ let a=s.val()||{},h=''; Object.values(a).forEach(p=>{ if(me&&p.username===me.username) return; h+=`<div onclick="document.getElementById('dmUser').value='${p.username}';openDM()" style="padding:10px;border-bottom:1px solid #111;cursor:pointer">@${p.username} - ${p.country}</div>`;}); document.getElementById('dmList').innerHTML=h; }); }
function openDM(){ dmTarget=document.getElementById('dmUser').value.trim().toLowerCase(); if(!dmTarget){alert('Village ID');return;} document.getElementById('dmHead').innerText='Chat @'+dmTarget; let area=document.getElementById('dmChatArea'); area.innerHTML=''; let chatId=[me.username,dmTarget].sort().join('__'); db.ref('dms/'+chatId).off(); db.ref('dms/'+chatId).limitToLast(50).on('child_added',snap=>{ let m=snap.val(); let isMe=m.from===me.username; let div=document.createElement('div'); div.style.cssText=`max-width:75%;padding:8px 12px;border-radius:14px;font-size:13px;margin:3px 0;${isMe?'margin-left:auto;background:#fff;color:#000':'background:#222;color:#fff'}`; div.innerText=m.text; area.appendChild(div); area.scrollTop=area.scrollHeight; });}
function sendDM(){ let t=document.getElementById('dmMsg').value.trim(); if(!t||!dmTarget){alert('Msg');return;} let chatId=[me.username,dmTarget].sort().join('__'); db.ref('dms/'+chatId).push({from:me.username,text:t,time:Date.now()}); document.getElementById('dmMsg').value='';}
</script>
</body>
</html>
