<script>
const c=document.getElementById('matrix'),x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);const ch="01theredeye";const dr=Array(Math.floor(c.width/14)).fill(1);setInterval(()=>{x.fillStyle="rgba(0,0,0,0.05)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#ff0f0f";x.font="12px monospace";dr.forEach((y,i)=>{x.fillText(ch[Math.floor(Math.random()*ch.length)],i*14,y*14);if(y*14>c.height&&Math.random()>0.975)dr[i]=0;dr[i]++})},50);

let currentOTP=0;function sendOTP(){let phone=document.getElementById('loginPhone').value.trim();if(phone.length<8){alert('Enter valid phone');return;}currentOTP=Math.floor(100000+Math.random()*900000);document.getElementById('otpDisplay').style.display='block';document.getElementById('otpDisplay').innerHTML=`OTP Sent<br><b style="font-size:26px">${currentOTP}</b>`;document.getElementById('otpBox').style.display='block';}function verifyOTP(){let entered=document.getElementById('loginOTP').value.trim();if(entered==currentOTP){document.getElementById('loginSection').style.display='none';document.getElementById('villageMain').style.display='block';}else{alert('Wrong OTP Correct: '+currentOTP);}}

  const allFriends=[{name:'Ivan',c:'Russia',cc:'ru',flag:'🇷🇺',img:15,work:'Farmer'},{name:'John',c:'USA',cc:'en',flag:'🇺🇸',img:16,work:'Rancher'},{name:'Sita',c:'Nepal',cc:'ne',flag:'🇳🇵',img:17,work:'Hill'},{name:'Sakura',c:'Japan',cc:'ja',flag:'🇯🇵',img:31,work:'Tokyo'},{name:'Carlos',c:'Brazil',cc:'pt',flag:'🇧🇷',img:18,work:'Coffee'},{name:'Olena',c:'Ukraine',cc:'uk',flag:'🇺🇦',img:19,work:'Teacher'},{name:'Maria',c:'Spain',cc:'es',flag:'🇪🇸',img:20,work:'Olive'},{name:'Anaya',c:'India',cc:'hi',flag:'🇮🇳',img:33,work:'Punjab'},{name:'Hans',c:'Germany',cc:'de',flag:'🇩🇪',img:21,work:'Bavaria'},{name:'Pierre',c:'France',cc:'fr',flag:'🇫🇷',img:22,work:'Vineyard'},{name:'Luca',c:'Italy',cc:'it',flag:'🇮🇹',img:23,work:'Tuscany'},{name:'Ahmed',c:'Egypt',cc:'ar',flag:'🇪🇬',img:24,work:'Nile'},{name:'Emma',c:'UK',cc:'en',flag:'🇬🇧',img:25,work:'Countryside'}];
  let friendsHTML=allFriends.map(f=>`<div style="min-width:138px;border:1px solid #222;border-radius:10px;padding:10px;text-align:center;background:#0a0a0a"><div style="position:relative;display:inline-block"><img src="https://i.pravatar.cc/100?img=${f.img}" style="width:60px;height:60px;border-radius:50%"><div style="position:absolute;bottom:-2px;right:-2px;font-size:16px">${f.flag}</div></div><div style="font-size:12px;font-weight:700;margin-top:6px">${f.name} • ${f.c}</div><div style="font-size:10px;color:#aaa">${f.work} • ${f.cc.toUpperCase()}</div><button onclick="addFriend(this,'${f.cc}')" style="margin-top:8px;width:100%;background:#0095f6;color:#fff;border:none;padding:7px;border-radius:6px;font-size:11px;font-weight:700">Make Friend</button><button onclick="openChat('${f.name}','${f.cc}')" style="margin-top:5px;width:100%;background:#1a1a1a;color:#fff;border:1px solid #333;padding:6px;border-radius:6px;font-size:11px">Message</button></div>`).join('');
  document.getElementById('wrap').innerHTML=`<div id="realInsta" style="display:flex;flex-direction:column;height:100vh;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont;max-width:480px;margin:auto;border:1px solid #222"><style>.story-ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:2px;border-radius:50%}</style><div style="height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-bottom:1px solid #222;background:#000;position:sticky;top:0;z-index:10"><span style="font-family:'Brush Script MT',cursive;font-size:24px">World Village Talk</span><div style="display:flex;gap:12px;font-size:20px">♡ ✈︎ <button onclick="location.reload()" style="background:#222;color:#fff;border:none;padding:3px 8px;border-radius:4px;font-size:10px">EXIT</button></div></div><div style="display:flex;gap:14px;padding:10px;overflow-x:auto;border-bottom:1px solid #121212">${allFriends.slice(0,8).map(f=>`<div style="text-align:center;min-width:62px"><div style="background:linear-gradient(45deg,#00d4ff,#0ff);padding:2px;border-radius:50%"><img src="https://i.pravatar.cc/100?img=${f.img}" style="width:54px;height:54px;border-radius:50%;border:2px solid #000"></div><div style="font-size:9px;margin-top:3px">${f.flag} ${f.c}</div></div>`).join('')}</div><div style="flex:1;overflow-y:auto"><div style="padding:12px 10px"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">All Countries • Suggested Friends (${allFriends.length})</b><span style="font-size:12px;color:#00d4ff">See All</span></div><div style="display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:6px">${friendsHTML}</div></div><div style="padding:10px;display:flex;gap:10px;align-items:center;border-top:1px solid #111;border-bottom:1px solid #111"><div style="width:32px;height:32px;border-radius:50%;background:#00d4ff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900">${name[0].toUpperCase()}</div><b style="font-size:13px">${name} → ${country.toUpperCase()} Village • Live</b></div><div id="chat" style="background:#0a0a0a;min-height:260px;padding:12px;display:flex;flex-direction:column;gap:8px"><div style="background:#1a1a1a;padding:10px 14px;border-radius:16px;max-width:80%;font-size:13px">Welcome ${name}! Select any friend. Translate EN → ${country.toUpperCase()} active.</div></div><div style="padding:8px 12px;font-size:11px;color:#00d4ff" id="transInfo">All countries ready</div></div><div style="background:#000;border-top:1px solid #222;position:sticky;bottom:0"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px"><div style="width:30px;height:30px;border-radius:50%;background:#00d4ff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px">${name[0].toUpperCase()}</div><div style="flex:1;display:flex;align-items:center;background:#121212;border:1px solid #333;border-radius:24px;padding:0 10px"><input id="msg" placeholder="Message to ${country} village..." style="flex:1;background:transparent;border:none;color:#fff;padding:11px 0;font-size:13px" onkeydown="if(event.key==='Enter')sendMsg('${country}')"><span>😊</span></div><button onclick="sendMsg('${country}')" style="background:#00d4ff;color:#000;border:none;padding:9px 16px;border-radius:20px;font-weight:700;font-size:13px">SEND</button></div><div style="height:44px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #111;font-size:20px"><span>⌂</span><span>◉</span><span>＋</span><span>✈︎</span><span>👤</span></div></div></div>`;
}
function addFriend(btn,lang){btn.innerText='✓ Friend Added';btn.style.background='#111';btn.style.color='#00d4ff';btn.style.border='1px solid #00d4ff';}
function openChat(name,lang){document.getElementById('msg').placeholder='Message '+name+' in '+lang+'...';document.getElementById('msg').focus();document.getElementById('transInfo').innerText='Chatting with '+name+' • EN → '+lang;}
async function sendMsg(lang){let t=document.getElementById('msg').value.trim();if(!t)return;let chat=document.getElementById('chat');chat.innerHTML+=`<div style="align-self:flex-end;background:#0095f6;color:#fff;padding:10px 14px;border-radius:18px;max-width:75%;font-size:13px">YOU: ${t}</div>`;document.getElementById('msg').value='';try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=en|'+lang);let d=await r.json();chat.innerHTML+=`<div style="background:#262626;color:#fff;padding:10px 14px;border-radius:18px;max-width:75%;font-size:13px">🌍 [${lang.toUpperCase()}]: ${d.responseData.translatedText}</div>`;document.getElementById('transInfo').innerText='Translated: '+d.responseData.translatedText;}catch(e){chat.innerHTML+=`<div style="background:#222;padding:10px;border-radius:12px">Sent: ${t}</div>`;}chat.scrollTop=chat.scrollHeight;}
