<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>theredeye.co.in - World Village Talk</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace}
#wrap{max-width:760px;margin:auto;padding:12px}
.top-nav{text-align:center;padding:10px;background:#111;border-bottom:1px solid #ff0f0f;position:sticky;top:0;z-index:99}
.top-nav a{color:#fff;text-decoration:none;margin:0 4px;font-size:10px;border:1px solid #333;padding:4px 7px;border-radius:4px}
.cat{border:1px solid #ff0f0f;margin:16px 0;padding:10px;border-radius:12px;background:#0f0000}
.cat h2{text-align:center;color:#fff;border-bottom:1px dashed #ff0f0f;font-size:11px;padding-bottom:5px}
.box{border:1px solid #222;margin:8px 0;padding:9px;border-radius:8px;background:#0a0a0a}
input,select{width:100%;background:#000;border:1px solid #ff0f0f;color:#fff;padding:10px;margin:5px 0;border-radius:6px;box-sizing:border-box}
button{background:#000;border:1px solid #ff0f0f;color:#ff0f0f;padding:10px;margin:4px 0;border-radius:8px;cursor:pointer;font-weight:700;width:100%}
.res{background:#000;border:1px solid #222;padding:8px;min-height:16px;color:#0f0;font-size:11px;white-space:pre-wrap;word-break:break-all;margin-top:6px;border-radius:6px}
.insta-header{font-family:'Grand Hotel',cursive;font-size:34px;color:#fff}
.story-diamond{width:58px;height:58px;transform:rotate(45deg);border-radius:14px;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);margin:5px auto}
.story-diamond img{width:100%;height:100%;object-fit:cover;transform:rotate(-45deg);border-radius:11px;border:2px solid #000}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:999}
.livechat{max-width:75%;padding:8px 12px;border-radius:16px;font-size:11px;margin:5px 0}
.me{margin-left:auto;background:#0095f6;color:#fff}
.other{background:#262626;color:#fff}
</style>
</head>
<body>
<div class="top-nav">
<a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="contact.html">Contact</a><a href="terms.html">Terms</a>
</div>

<div id="wrap">
<div style="text-align:center;padding:15px 0">
<h1 style="margin:0;color:#ff0f0f;text-shadow:0 0 20px #ff0f0f;letter-spacing:3px">THEREDEYE.CO.IN</h1>
<p style="font-size:10px;color:#aaa">WORLD VILLAGE TALK - CONNECT VILLAGES WORLDWIDE</p>
</div>

<div class="cat" style="border-color:#ff3040">
<h2 style="color:#ff3040">WORLD VILLAGE TALK - LIVE CHAT</h2>
<div class="box">
<div id="loginSection">
<input id="loginPhone" type="tel" placeholder="Enter phone number e.g. 9876543210">
<button type="button" onclick="sendOTP()" style="background:#ff3040;color:#fff;border:none">SEND OTP</button>
<div id="otpDisplay" class="res" style="display:none;text-align:center;font-size:14px"></div>
<div id="otpBox" style="display:none;margin-top:10px">
<input id="loginOTP" type="tel" placeholder="Enter OTP shown above">
<button type="button" onclick="verifyOTP()" style="background:#0f0;color:#000;border:none">VERIFY OTP</button>
</div>
</div>

<div id="villageMain" style="display:none">
<select id="villageCountry">
<option value="">Select Country</option>
<option value="ru">Russia</option>
<option value="en">USA</option>
<option value="hi">India</option>
<option value="es">Spanish</option>
<option value="pt">Brazil</option>
<option value="uk">Ukraine</option>
<option value="ne">Nepal</option>
<option value="ja">Japan</option>
</select>
<input id="villageName" placeholder="Enter name e.g. praveen_palampur">
<button type="button" onclick="villageConnect()" style="background:#ff3040;color:#fff;border:none">CONNECT NOW</button>
</div>

<div id="autoLoginMsg" style="display:none;text-align:center;padding:20px;color:#0f0;font-size:12px">Welcome back! Loading...</div>
</div>
</div>

<div class="cat">
<h2>GAME APPEAL HELPER</h2>
<div class="box">
<select id="game"><option>BGMI</option><option>Free Fire</option><option>Valorant</option><option>PUBG</option></select>
<input id="uid" placeholder="Game ID">
<input id="reason" placeholder="Reason e.g. mistaken ban">
<button type="button" onclick="genUnban()">GENERATE APPEAL</button>
<div id="unbanRes" class="res" style="display:none"></div>
<button id="copyBtn" type="button" style="display:none" onclick="copyUnban()">COPY TEXT</button>
</div>
</div>

<div class="cat">
<h2>SAFETY TOOLS</h2>
<div class="box"><h3>Email Breach Check</h3><input id="e1" placeholder="email@gmail.com"><button type="button" onclick="breach()">Check</button><div id="r1" class="res"></div></div>
<div class="box"><h3>My IP</h3><button type="button" onclick="myIP()">Get My IP</button><div id="r15" class="res"></div></div>
<div class="box"><h3>QR Generator</h3><input id="qr1" placeholder="Enter text for QR"><button type="button" onclick="qrGen()">Generate QR</button><div id="r37" class="res"></div></div>
<div class="box"><h3>Password Generator</h3><button type="button" onclick="genPass()">Generate Strong Password</button><div id="r36" class="res"></div></div>
</div>

<div style="text-align:center;padding:20px;color:#555;font-size:10px">
theredeye.co.in © 2026 - Palampur<br>
<button type="button" onclick="logoutVillage()" style="width:auto;padding:5px 12px;font-size:9px;border-color:#555;color:#555">Logout / Change Account</button>
</div>
</div>

<script>
// Firebase hidden config
const _cfg="eyJhcGlLZXkiOiJBSXphU3lBRTBncEh6Y0ZsV3RKc2g4TDZQUG9iSnJRZDJFaE1mSjAiLCJhdXRoRG9tYWluIjoidGhlcmVkZXllLXZpbGxhZ2UuZmlyZWJhc2VhcHAuY29tIiwiZGF0YWJhc2VVUkwiOiJodHRwczovL3RoZXJlZGV5ZS12aWxsYWdlLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbSIsInByb2plY3RJZCI6InRoZXJlZGV5ZS12aWxsYWdlIiwic3RvcmFnZUJ1Y2tldCI6InRoZXJlZGV5ZS12aWxsYWdlLmZpcmViYXNlc3RvcmFnZS5hcHAiLCJtZXNzYWdpbmdTZW5kZXJJZCI6IjEwMDk1Mzk5NzQ5ODYiLCJhcHBJZCI6IjE6MTAwOTUzOTk3NDk4Njp3ZWI6Y2JmODk3ZjI0YTkyMzM5ZGQxZTNiMyJ9";
const firebaseConfig=JSON.parse(atob(_cfg));
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let currentOTP=0, me=null, chatId=null, myLang='hi';

// Auto login
(function(){
  let saved=localStorage.getItem('village_me');
  if(saved){
    try{
      me=JSON.parse(saved);
      myLang=me.country||'hi';
      document.addEventListener('DOMContentLoaded', function(){
        document.getElementById('loginSection').style.display='none';
        document.getElementById('villageMain').style.display='none';
        document.getElementById('autoLoginMsg').style.display='block';
        setTimeout(showLiveApp, 800);
      });
    }catch(e){}
  }
})();

function logoutVillage(){
  if(confirm('Logout karna hai?')){
    localStorage.removeItem('village_me');
    location.reload();
  }
}

function sendOTP(){
  let p=document.getElementById('loginPhone').value.trim();
  if(p.length < 8){ alert('Phone number daal bhai'); return; }
  currentOTP=Math.floor(100000+Math.random()*900000);
  let d=document.getElementById('otpDisplay');
  let b=document.getElementById('otpBox');
  d.style.display='block';
  d.innerHTML='Tera OTP hai: <b style="font-size:26px;color:#ff3040;display:block;margin-top:5px">'+currentOTP+'</b><span style="font-size:10px;color:#888">Is OTP ko neeche daal</span>';
  b.style.display='block';
  console.log('OTP Generated:', currentOTP);
  b.scrollIntoView({behavior:'smooth'});
}

function verifyOTP(){
  let entered=document.getElementById('loginOTP').value.trim();
  if(entered == currentOTP && currentOTP != 0){
    document.getElementById('loginSection').style.display='none';
    document.getElementById('villageMain').style.display='block';
    document.getElementById('otpDisplay').style.display='none';
    document.getElementById('otpBox').style.display='none';
  } else {
    alert('Galat OTP! Sahi OTP hai: '+currentOTP);
  }
}

function villageConnect(){
  let country=document.getElementById('villageCountry').value;
  let raw=document.getElementById('villageName').value.trim();
  if(!country){ alert('Country select kar'); return; }
  if(!raw){ alert('Name daal'); return; }
  let uname=raw.toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20);
  if(uname.length < 3) uname='user'+Date.now();
  myLang=country;
  me={username:uname,name:raw,country:country,pic:'https://i.pravatar.cc/150?u='+uname,online:true,joined:Date.now()};
  localStorage.setItem('village_me', JSON.stringify(me));
  db.ref('profiles/'+uname).set(me).then(()=>{ showLiveApp(); }).catch(e=>{ console.log(e); showLiveApp(); });
}

function showLiveApp(){
  document.getElementById('wrap').innerHTML=`
  <div style="background:#000;color:#fff;min-height:100vh;padding-bottom:70px">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10">
  <span style="font-size:24px">+</span><span class="insta-header">World Village Talk</span><span onclick="openReqs()" style="font-size:22px;cursor:pointer">♡<span id="heartCount" style="color:red;font-size:10px"></span></span>
  </div>
  <div style="display:flex;gap:6px;overflow-x:auto;padding:10px 6px;border-bottom:1px solid #111">
  <div style="text-align:center;min-width:76px"><div class="story-diamond" style="background:#333"><img src="${me.pic}"></div><div style="font-size:9px;margin-top:8px">Your story</div></div>
  <div id="worldStories" style="display:flex;gap:6px"></div>
  </div>
  <div style="padding:10px">
  <div style="background:#111;border:1px solid #222;border-radius:10px;padding:10px;margin-bottom:10px">
  <div style="font-size:11px;color:#ff3040;font-weight:800">FRIENDS (<span id="fCount">0</span>) <button id="reqBtn" style="display:none;float:right;background:#ff3040;color:#fff;border:none;padding:3px 8px;border-radius:10px;font-size:9px" onclick="openReqs()">Requests</button></div>
  <div id="friendsList" style="max-height:120px;overflow-y:auto;margin-top:6px">Loading...</div>
  </div>
  <div style="background:#111;border:1px solid #222;border-radius:10px;padding:10px;margin-bottom:10px">
  <div style="font-size:11px;color:#aaa">WORLD VILLAGES</div>
  <div id="worldList" style="max-height:150px;overflow-y:auto;margin-top:6px">Loading...</div>
  </div>
  <div style="border:1px solid #222;border-radius:10px;overflow:hidden;background:#000">
  <div id="chatHead" style="padding:10px;background:#111;font-size:11px">Select a friend to start LIVE chat</div>
  <div id="chatArea" style="height:220px;overflow-y:auto;padding:10px;display:flex;flex-direction:column"></div>
  <div style="padding:8px;border-top:1px solid #222;display:flex;gap:6px">
  <input id="msgInput" placeholder="Type message..." style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:10px;border-radius:20px" onkeydown="if(event.key==='Enter')sendLiveMsg()">
  <button type="button" onclick="sendLiveMsg()" style="width:auto;background:#0095f6;color:#fff;border:none;padding:10px 16px;border-radius:20px">Send</button>
  </div>
  <div id="transInfo" style="padding:5px;font-size:9px;color:#00d4ff;background:#111;text-align:center"></div>
  </div>
  </div>
  <div id="reqArea" style="display:none;padding:10px;background:#111;margin:10px;border-radius:10px"></div>
  <div style="text-align:center;padding:10px"><button type="button" onclick="logoutVillage()" style="width:auto;font-size:9px;border-color:#555;color:#888">Logout / Switch Account</button></div>
  <div class="bottom-nav"><span onclick="location.reload()" style="font-size:24px;color:#fff;cursor:pointer">⌂</span><span style="font-size:20px">▶</span><span style="font-size:20px">✈</span><span style="font-size:20px">○</span><span><img src="${me.pic}" style="width:24px;height:24px;border-radius:50%"></span></div>
  </div>`;
  loadWorldReal(); loadFriendsReal(); watchReqsReal();
}

function loadWorldReal(){
  db.ref('profiles').on('value', s=>{
    let all=s.val()||{}, h='', sh='';
    Object.values(all).forEach(p=>{
      if(p.username===me.username) return;
      h+=`<div style="padding:6px;border-bottom:1px solid #111;display:flex;gap:6px;align-items:center"><img src="${p.pic}" style="width:26px;height:26px;border-radius:50%"><div style="flex:1"><div style="font-size:11px">@${p.username}</div><div style="font-size:8px;color:#888">${p.country}</div></div><button type="button" onclick="addFriendReal('${p.username}')" style="width:auto;background:#0095f6;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:9px">Add</button></div>`;
      sh+=`<div style="text-align:center;min-width:76px" onclick="addFriendReal('${p.username}')"><div class="story-diamond"><img src="${p.pic}"></div><div style="font-size:9px;margin-top:8px">${p.username}</div></div>`;
    });
    let wl=document.getElementById('worldList'); if(wl) wl.innerHTML=h||'No users yet - be first!';
    let ws=document.getElementById('worldStories'); if(ws) ws.innerHTML=sh||'';
  });
}
function addFriendReal(to){ db.ref('requests/'+to+'/'+me.username).set({from:me.username,name:me.name,pic:me.pic,time:Date.now()}); alert('Request sent to @'+to); }
function watchReqsReal(){
  db.ref('requests/'+me.username).on('value', s=>{
    let r=s.val()||{}, c=Object.keys(r).length;
    let btn=document.getElementById('reqBtn'); let hc=document.getElementById('heartCount');
    if(!btn) return;
    if(c>0){ btn.style.display='block'; btn.innerText=c+' Requests'; btn._data=r; if(hc) hc.innerText=c; } else { btn.style.display='none'; if(hc) hc.innerText=''; }
  });
}
function openReqs(){
  let btn=document.getElementById('reqBtn'); let r=btn?btn._data||{}:{}; let area=document.getElementById('reqArea');
  area.style.display='block'; area.innerHTML='<b style="color:#ff3040">Follow Requests</b><br>';
  if(Object.keys(r).length==0) area.innerHTML+='<div style="font-size:10px;color:#888">No requests</div>';
  Object.values(r).forEach(x=>{ area.innerHTML+=`<div style="padding:8px;border-bottom:1px solid #222;display:flex;gap:8px;align-items:center"><img src="${x.pic}" style="width:28px;height:28px;border-radius:50%"><div style="flex:1"><div style="font-size:11px">${x.name}</div><div style="font-size:9px;color:#888">@${x.from}</div></div><button type="button" onclick="acceptReal('${x.from}')" style="width:auto;background:#0f0;color:#000;border:none;padding:6px 12px;border-radius:6px">Accept</button></div>`; });
  area.scrollIntoView({behavior:'smooth'});
}
function acceptReal(from){ db.ref('friends/'+me.username+'/'+from).set(true); db.ref('friends/'+from+'/'+me.username).set(true); db.ref('requests/'+me.username+'/'+from).remove(); alert('Now friends with @'+from); }
function loadFriendsReal(){
  db.ref('friends/'+me.username).on('value', s=>{
    let d=s.val()||{}, h=''; let fc=document.getElementById('fCount'); if(fc) fc.innerText=Object.keys(d).length;
    Object.keys(d).forEach(u=>{ h+=`<div onclick="startChatReal('${u}')" style="padding:8px;border-bottom:1px solid #111;display:flex;gap:8px;align-items:center;cursor:pointer"><div style="width:22px;height:22px;background:#0095f6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff">${u[0].toUpperCase()}</div><div style="font-size:11px">@${u}</div><div style="margin-left:auto;width:6px;height:6px;background:#0f0;border-radius:50%"></div></div>`; });
    let fl=document.getElementById('friendsList'); if(fl) fl.innerHTML=h||'Add friends from World section';
  });
}
function startChatReal(other){
  chatId=[me.username, other].sort().join('__');
  document.getElementById('chatHead').innerHTML=`Chat with <b>@${other}</b> ● LIVE`;
  let area=document.getElementById('chatArea'); area.innerHTML='';
  db.ref('chats/'+chatId).off();
  db.ref('chats/'+chatId).limitToLast(60).on('child_added', snap=>{
    let m=snap.val(); let isMe=m.from===me.username;
    let div=document.createElement('div'); div.className='livechat '+(isMe?'me':'other');
    div.innerHTML=(isMe?'You: ':'@'+m.from+': ')+m.text+(m.trans?`<br><span style="font-size:9px;opacity:0.7">🌍 ${m.trans}</span>`:'');
    area.appendChild(div); area.scrollTop=area.scrollHeight;
  });
}
async function sendLiveMsg(){
  let t=document.getElementById('msgInput').value.trim();
  if(!t){ return; }
  if(!chatId){ alert('Pehle friend select kar'); return; }
  document.getElementById('msgInput').value='';
  let trans='';
  try{ let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=en|'+myLang); let d=await r.json(); trans=d.responseData.translatedText; document.getElementById('transInfo').innerText='🌍 '+trans; }catch(e){}
  db.ref('chats/'+chatId).push({from:me.username,text:t,trans:trans,time:Date.now()});
}

// Small tools
function genUnban(){ let u=document.getElementById('uid').value.trim(); if(!u){alert('ID daal');return;} let r=document.getElementById('unbanRes'); r.style.display='block'; r.innerText='Dear Team, My ID '+u+' was banned by mistake. Please review. I am a genuine player. Thank you.'; document.getElementById('copyBtn').style.display='block'; }
function copyUnban(){ navigator.clipboard.writeText(document.getElementById('unbanRes').innerText).then(()=>alert('Copied!')); }
function breach(){ let e=document.getElementById('e1').value.trim(); let r=document.getElementById('r1'); r.innerText='Checking...'; fetch('https://api.xposedornot.com/v1/check-email/'+encodeURIComponent(e)).then(j=>j.json()).then(d=>r.innerText=JSON.stringify(d,null,2)).catch(()=>r.innerText='Safe or API busy'); }
async function myIP(){ try{ let d=await fetch('https://api.ipify.org?format=json').then(j=>j.json()); document.getElementById('r15').innerText='Your IP: '+d.ip; }catch{ document.getElementById('r15').innerText='Failed to get IP'; } }
function genPass(){ let c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#', p=''; for(let i=0;i<16;i++) p+=c[Math.floor(Math.random()*c.length)]; document.getElementById('r36').innerText=p; }
function qrGen(){ let v=document.getElementById('qr1').value.trim(); if(!v){alert('Text daal');return;} document.getElementById('r37').innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(v)}" style="border:5px solid #fff">`; }
</script>
</body>
</html>
