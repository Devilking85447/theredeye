<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>theredeye.co.in - Instagram Style</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:sans-serif}
#app{max-width:500px;margin:auto;min-height:100vh;background:#000;padding-bottom:70px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}
.logo{font-family:'Grand Hotel',cursive;font-size:32px}
.storyBar{display:flex;gap:12px;overflow-x:auto;padding:12px;border-bottom:1px solid #111}
.story{ text-align:center; min-width:65px; }
.diamond{width:60px;height:60px;transform:rotate(45deg);background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);border-radius:15px;padding:3px;margin:0 auto 6px auto}
.diamond img{width:100%;height:100%;object-fit:cover;transform:rotate(-45deg);border-radius:12px;border:2px solid #000}
.name{font-size:10px}
.card{background:#111;border:1px solid #222;border-radius:12px;margin:10px;padding:12px}
input,select{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0}
button{width:100%;padding:12px;background:#0095f6;border:none;color:#fff;border-radius:8px;font-weight:700;margin:6px 0}
button.green{background:#0f0;color:#000}
button.red{background:#ff3040}
.res{background:#000;border:1px solid #333;padding:10px;border-radius:8px;color:#0f0;font-size:12px;white-space:pre-wrap;margin-top:8px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0}
.bottom i{font-size:22px;color:#fff}
.chat{max-width:75%;padding:8px 12px;border-radius:18px;font-size:13px;margin:5px 0}
.me{margin-left:auto;background:#0095f6}
.other{background:#262626}
</style>
</head>
<body>
<div id="app">
<div class="top"><i class="fa-solid fa-plus"></i><span class="logo">World Village Talk</span><i class="fa-regular fa-heart"></i></div>
<div class="storyBar">
<div class="story"><div class="diamond"><img id="myPic" src="https://i.pravatar.cc/150?u=you"></div><div class="name">Your story</div></div>
<div class="story"><div class="diamond"><img src="https://i.pravatar.cc/150?u=russia"></div><div class="name">russia_village</div></div>
<div class="story"><div class="diamond"><img src="https://i.pravatar.cc/150?u=usa"></div><div class="name">usa_farm</div></div>
<div class="story"><div class="diamond"><img src="https://i.pravatar.cc/150?u=india"></div><div class="name">india_palampur</div></div>
</div>

<div id="loginBox" class="card">
<h3 style="text-align:center;color:#ff3040">LOGIN TO VILLAGE</h3>
<div id="s1"><input id="phone" placeholder="Phone number"><button class="red" onclick="sendOTP()">SEND OTP</button><div id="otpShow" class="res" style="display:none"></div></div>
<div id="s2" style="display:none"><input id="otpInput" placeholder="Enter OTP"><button class="green" onclick="verifyOTP()">VERIFY OTP</button></div>
<div id="s3" style="display:none;border:2px solid #0f0;padding:10px;border-radius:10px;background:#001a00"><h4 style="text-align:center;color:#0f0;margin:5px">CREATE PROFILE - Instagram Style</h4><select id="country"><option value="">Select Country</option><option value="India">India</option><option value="Russia">Russia</option><option value="USA">USA</option><option value="Brazil">Brazil</option></select><input id="username" placeholder="Username e.g. praveen_palampur"><button class="green" onclick="createProfile()">CONNECT NOW</button></div>
</div>

<div id="mainBox" style="display:none">
<div class="card"><b>FRIENDS - <span id="fCount">3</span> Online</b><div style="margin-top:8px"><div onclick="openChat('russia_village')" style="padding:8px;border-bottom:1px solid #222;cursor:pointer">🇷🇺 russia_village ●</div><div onclick="openChat('usa_farm')" style="padding:8px;border-bottom:1px solid #222;cursor:pointer">🇺🇸 usa_farm ●</div><div onclick="openChat('india_palampur')" style="padding:8px;border-bottom:1px solid #222;cursor:pointer">🇮🇳 india_palampur ●</div></div></div>
<div class="card"><div id="chatHead" style="font-weight:700;padding-bottom:8px;border-bottom:1px solid #222">Select friend for LIVE chat</div><div id="chatArea" style="height:220px;overflow-y:auto;display:flex;flex-direction:column;padding:10px 0"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="msg" placeholder="Message..." style="flex:1"><button onclick="sendMsg()" style="width:auto;padding:12px 18px">Send</button></div></div>
</div>

<div class="card"><h3><i class="fa-solid fa-gamepad"></i> GAME APPEAL</h3><select id="game"><option>BGMI</option><option>Free Fire</option></select><input id="gid" placeholder="Game ID"><button onclick="genAppeal()">Generate</button><div id="gRes" class="res" style="display:none"></div></div>
<div class="card"><h3><i class="fa-solid fa-shield-halved"></i> SAFETY TOOLS</h3><input id="emailCheck" placeholder="email@gmail.com"><button onclick="checkEmail()">Check Breach</button><div id="eRes" class="res"></div><br><button onclick="getIP()">My IP</button><div id="ipRes" class="res"></div><br><input id="qrText" placeholder="Text for QR"><button onclick="genQR()">Generate QR</button><div id="qrRes" class="res"></div></div>

<div style="text-align:center;padding:20px;color:#555;font-size:10px">theredeye.co.in © 2026<br><span onclick="localStorage.clear();location.reload()" style="text-decoration:underline;cursor:pointer">Logout</span></div>
<div class="bottom"><i class="fa-solid fa-house" onclick="window.scrollTo(0,0)"></i><i class="fa-solid fa-magnifying-glass"></i><i class="fa-regular fa-square-plus"></i><i class="fa-solid fa-clapperboard"></i><i class="fa-regular fa-user"></i></div>
</div>

<script>
let OTP=0, me=null, currentChat=null;
let saved=localStorage.getItem('village_user');
if(saved){ me=JSON.parse(saved); document.getElementById('loginBox').style.display='none'; document.getElementById('mainBox').style.display='block'; document.getElementById('myPic').src=me.pic; }

function sendOTP(){
 let p=document.getElementById('phone').value.trim();
 if(p.length<8){alert('Phone daal');return;}
 OTP=Math.floor(100000+Math.random()*900000);
 let d=document.getElementById('otpShow'); d.style.display='block'; d.innerHTML='Tera OTP: <b style="font-size:28px;color:#ff3040">'+OTP+'</b>';
 document.getElementById('s2').style.display='block';
}
function verifyOTP(){
 let e=document.getElementById('otpInput').value.trim();
 if(e==OTP){ document.getElementById('s1').style.display='none'; document.getElementById('s2').style.display='none'; document.getElementById('s3').style.display='block'; alert('OTP sahi hai, ab profile banao'); }
 else alert('Galat OTP, sahi hai: '+OTP);
}
function createProfile(){
 let c=document.getElementById('country').value, u=document.getElementById('username').value.trim();
 if(!c||!u){alert('Country + Username daal');return;}
 me={username:u.toLowerCase().replace(/[^a-z0-9_]/g,''), name:u, country:c, pic:'https://i.pravatar.cc/150?u='+u };
 localStorage.setItem('village_user', JSON.stringify(me));
 document.getElementById('loginBox').style.display='none'; document.getElementById('mainBox').style.display='block'; document.getElementById('myPic').src=me.pic;
 alert('Profile ban gaya @'+me.username);
}
function openChat(user){
 currentChat=user; document.getElementById('chatHead').innerHTML='Chat with @'+user+' ● LIVE'; document.getElementById('chatArea').innerHTML='<div class="chat other">Hi from @'+user+'! Welcome to village talk.</div>';
}
function sendMsg(){
 let t=document.getElementById('msg').value.trim(); if(!t||!currentChat){alert('Friend select kar');return;}
 let area=document.getElementById('chatArea'); let d=document.createElement('div'); d.className='chat me'; d.innerText='You: '+t; area.appendChild(d); document.getElementById('msg').value=''; area.scrollTop=area.scrollHeight;
 setTimeout(()=>{ let r=document.createElement('div'); r.className='chat other'; r.innerText='@'+currentChat+': '+t+' (translated)'; area.appendChild(r); area.scrollTop=area.scrollHeight; },800);
}
function genAppeal(){let id=document.getElementById('gid').value.trim(); if(!id){alert('ID daal');return;} let r=document.getElementById('gRes'); r.style.display='block'; r.innerText='Dear Team, My ID '+id+' banned by mistake. Please unban. I am genuine player. Thank you.';}
function checkEmail(){let e=document.getElementById('emailCheck').value.trim(); document.getElementById('eRes').innerText='Checking '+e+'... Safe (demo)';}
async function getIP(){try{let d=await fetch('https://api.ipify.org?format=json').then(j=>j.json()); document.getElementById('ipRes').innerText='Your IP: '+d.ip;}catch{document.getElementById('ipRes').innerText='IP: 127.0.0.1 (offline demo)';}}
function genQR(){let v=document.getElementById('qrText').value.trim(); if(!v){alert('Text daal');return;} document.getElementById('qrRes').innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(v)+'" style="border:5px solid #fff;border-radius:10px">';}
</script>
</body>
</html>
