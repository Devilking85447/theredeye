<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXIF Viewer - Hidden GPS Check - theredeye.co.in</title><meta name="description" content="EXIF Data Viewer Check Hidden GPS Location in Photo by Praveen Bansal"><style>body{margin:0;background:#000;color:#0f0;font-family:monospace;padding:12px}h1{color:#0f0;text-align:center;text-shadow:0 0 15px #0f0}.box{border:1px solid #0f0;border-radius:12px;padding:15px;max-width:700px;margin:15px auto;background:rgba(0,20,0,.9)}input{width:100%;padding:12px;background:#111;border:1px solid #0f0;color:#fff;border-radius:6px;box-sizing:border-box}pre{background:#000;padding:12px;border:1px solid #333;color:#fff;white-space:pre-wrap;word-break:break-all;min-height:100px;font-size:11px}#warn{border:1px dashed #ff0f0f;color:#ff0f0f;padding:10px;margin:10px 0;display:none}button{padding:10px;background:#0f0;color:#000;font-weight:900;border:0;border-radius:6px;cursor:pointer;width:100%;margin-top:8px}</style></head><body>
<h1>EXIF VIEWER</h1>
<p style="text-align:center;color:#fff;font-size:10px">Photo ka Hidden GPS Location Check - Educational Only</p>
<div class="box">
<input type="file" id="file" accept="image/*">
<div id="warn"></div>
<pre id="out">Select a photo...</pre>
<button onclick="removeExif()" id="remBtn" style="display:none">REMOVE EXIF & DOWNLOAD SAFE PHOTO</button>
<canvas id="c" style="display:none"></canvas>
</div>
<a href="../" style="color:#ff0f0f;display:block;text-align:center;margin:20px">← Back to THEREDEYE.CO.IN</a>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
<script>
let currentFile=null;
document.getElementById('file').onchange=e=>{
 let f=e.target.files[0]; if(!f)return; currentFile=f;
 document.getElementById('out').innerText='Reading EXIF...';
 EXIF.getData(f,function(){
  let all=EXIF.getAllTags(this); let txt='';
  if(!all || Object.keys(all).length===0){ txt='✅ No EXIF Data Found\nPhoto is SAFE to share (No GPS, No Camera Info)'; document.getElementById('warn').style.display='none'; }
  else{
   for(let k in all){ if(k.includes('GPS')) txt+=k+': '+all[k]+' [SENSITIVE]\n'; else txt+=k+': '+all[k]+'\n'; }
   if(all.GPSLatitude){
     let lat=EXIF.getTag(this,'GPSLatitude'), lon=EXIF.getTag(this,'GPSLongitude');
     let latRef=EXIF.getTag(this,'GPSLatitudeRef')||'N', lonRef=EXIF.getTag(this,'GPSLongitudeRef')||'E';
     let latDec=(lat[0]+lat[1]/60+lat[2]/3600)*(latRef=='S'?-1:1);
     let lonDec=(lon[0]+lon[1]/60+lon[2]/3600)*(lonRef=='W'?-1:1);
     document.getElementById('warn').innerHTML='⚠️ WARNING: GPS FOUND!<br>Latitude: '+latDec+'<br>Longitude: '+lonDec+'<br><a href="https://maps.google.com/?q='+latDec+','+lonDec+'" target="_blank" style="color:#ff0f0f">Open in Google Maps</a>';
     document.getElementById('warn').style.display='block';
   } else { document.getElementById('warn').style.display='none'; }
  }
  document.getElementById('out').innerText=txt;
  document.getElementById('remBtn').style.display='block';
 });
}
function removeExif(){
 if(!currentFile)return;
 let img=new Image(); let url=URL.createObjectURL(currentFile);
 img.onload=()=>{
  let c=document.getElementById('c'); c.width=img.width; c.height=img.height;
  c.getContext('2d').drawImage(img,0,0);
  let safe=c.toDataURL('image/jpeg',0.92);
  let a=document.createElement('a'); a.href=safe; a.download='safe-no-exif.jpg'; a.click();
  alert('Safe photo downloaded - EXIF removed!');
 }; img.src=url;
}
</script></body></html>
