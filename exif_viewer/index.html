<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXIF Data Viewer - theredeye.co.in</title><link rel="canonical" href="https://theredeye.co.in/exif-viewer/"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#ff0f0f;font-family:monospace;padding:15px}.box{max-width:600px;margin:auto;border:1px solid #ff0f0f;border-radius:16px;padding:20px;background:#0a0a0a}h1{color:#ff0f0f;text-align:center;letter-spacing:2px;font-size:18px}.up{border:2px dashed #ff0f0f88;padding:30px;border-radius:12px;text-align:center;cursor:pointer;margin:15px 0}.res{background:#111;padding:12px;border-radius:10px;font-size:11px;color:#0f0;white-space:pre-wrap;min-height:100px}.btn{width:100%;padding:12px;background:#ff0f0f;color:#000;font-weight:900;border:none;border-radius:10px;cursor:pointer;margin-top:10px}</style></head><body><div class="box"><h1>THEREDEYE.CO.IN - EXIF VIEWER</h1><p style="text-align:center;color:#666;font-size:9px">By Praveen Bansal - support@theredeye.co.in</p><div class="up" onclick="document.getElementById('f').click()">📸 CLICK TO UPLOAD PHOTO<input type="file" id="f" hidden accept="image/*"></div><div class="res" id="res">Upload a photo to see its hidden data (Location, Device, Time)...</div><button class="btn" onclick="document.getElementById('f').click()">UPLOAD ANOTHER</button><a href="../" style="color:#666;font-size:10px;text-align:center;display:block;margin-top:15px">← Back</a></div><script>document.getElementById('f').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let v=new DataView(r.result);let out=`File: ${f.name}\nSize: ${(f.size/1024).toFixed(2)} KB\nType: ${f.type}\n\n`;try{let j=0;if(v.getUint16(0)==0xFFD8){let off=2;while(off<v.byteLength){if(v.getUint16(off)==0xFFE1){out+='EXIF Found ✅\n';let exifOff=off+10;let little=v.getUint16(exifOff)==0x4949;function getU16(o){return v.getUint16(o,little)}function getU32(o){return v.getUint32(o,little)}let num=getU16(exifOff+8);for(let i=0;i<num;i++){let tagOff=exifOff+10+i*12;let tag=getU16(tagOff);if(tag==0x010F)out+='Device: (Maker) Found\n';if(tag==0x0110)out+='Model: (Phone) Found\n';if(tag==0x9003)out+='Date Taken: Found\n';if(tag==0x8825)out+='⚠️ GPS Location Data FOUND! - Photo has location!\n';}break}off+=2+v.getUint16(off+2)} }if(!out.includes('GPS'))out+='\n✅ No GPS Location Found - Safe to share\n';}catch(err){out+='No EXIF or EXIF Cleaned ✅ - Safe\n'}out+='\nChecked by theredeye.co.in - Praveen Bansal';document.getElementById('res').innerText=out;};r.readAsArrayBuffer(f.slice(0,65535));}</script></body></html>
