<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE RED EYE - Free Unban Tool</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}
.box{max-width:500px;margin:auto;background:#151515;border:1px solid #ff0000;border-radius:15px;padding:25px;box-shadow:0 0 20px #ff000033}
h1{color:#ff0000;letter-spacing:2px;margin:0}
input,select{width:100%;padding:12px;margin:10px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;background:linear-gradient(90deg,#ff0000,#8b0000);color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
#result{display:none;margin-top:20px;text-align:left;background:#000;padding:15px;border-radius:10px;border:1px dashed #ff0000;white-space:pre-wrap;font-size:14px}
.small{font-size:12px;color:#888;margin-top:15px}
a.btn{display:block;text-decoration:none;margin-top:10px;padding:12px;border-radius:8px;font-weight:bold}
.yt{background:#ff0000;color:#fff}
.qr-box{margin-top:15px;background:#fff;padding:15px;border-radius:12px}
.qr-box img{width:200px;height:200px;display:block;margin:auto}
.qr-box p{color:#000;margin:10px 0 0 0;font-weight:bold;font-size:15px}
</style>
</head>
<body>

<script>
const YOUTUBE_LINK = "https://youtube.com/@theredeye"; 
</script>

<div class="box">
<h1>THE RED EYE</h1>
<p style="color:#ff4d4d;margin-top:5px">FREE & SAFE APPEAL GENERATOR</p>

<select id="game"><option>BGMI</option><option>Free Fire MAX</option><option>PUBG MOBILE</option><option>Valorant</option></select>
<input id="uid" placeholder="Enter Your Game ID / UID">
<input id="reason" placeholder="Ban Reason (Ex: Third Party...)">
<button onclick="gen()">GENERATE LETTER - FREE</button>

<div id="result"></div>
<button id="copyBtn" style="display:none" onclick="copyT()">COPY LETTER</button>

<a id="ytBtn" class="btn yt" target="_blank">📺 Full Unban Process Video</a>

<!-- QR ONLY - NO UPI LINK -->
<div class="qr-box">
<img src="qr.jpg" alt="Support QR">
<p>Scan & Pay ₹49 to Support ❤️</p>
</div>

<p class="small">We don't ask for password. 100% safe method.</p>
<div id="ad-slot"></div>
</div>

<script>
document.getElementById('ytBtn').href = YOUTUBE_LINK;
function gen(){
let g=document.getElementById('game').value;
let u=document.getElementById('uid').value || "[Your ID]";
let r=document.getElementById('reason').value || "Not mentioned";
let d=new Date().toLocaleDateString();
let txt=`Subject: Request to Review Ban - ${g} ID ${u}\n\nRespected ${g} Support Team,\n\nMy account ID ${u} got banned for reason: ${r} on ${d}.\nI respectfully request you to review my account. I have never used any hack or third party tool.\n\nPlease give me a chance to review. I am a loyal player.\n\nThank You,\nPlayer ID: ${u}`;
document.getElementById('result').innerText=txt;
document.getElementById('result').style.display='block';
document.getElementById('copyBtn').style.display='block';
}
function copyT(){navigator.clipboard.writeText(document.getElementById('result').innerText);alert("Copied!");}
</script>
</body>
</html>
