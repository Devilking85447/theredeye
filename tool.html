<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheRedEye - Free BGMI Appeal Generator</title>
<style>
body{margin:0;background:#080808;color:#fff;font-family:Arial, sans-serif}
.box{max-width:520px;margin:20px auto;background:#141414;border:1.5px solid #ff0000;border-radius:14px;padding:20px}
h1{color:#ff0000;text-align:center;margin:0} 
p.s{color:#888;text-align:center;font-size:12px}
input,select{width:100%;padding:12px;margin-top:8px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;box-sizing:border-box}
button{width:100%;padding:13px;margin-top:12px;background:linear-gradient(90deg,#ff0000,#ff4400);border:none;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer}
.out{margin-top:14px;background:#1e1e1e;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:12px;display:none;border:1px solid #333}
.ad{margin:12px 0;background:#222;border:1px dashed #555;padding:12px;text-align:center;color:#aaa;font-size:12px;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h1>THE RED EYE</h1>
<p class="s">FREE & SAFE ACCOUNT APPEAL GENERATOR</p>

<div class="ad">YAHAN APNA ADSENSE CODE DALNA - Har 1000 views pe earning hogi</div>

<label>Game</label>
<select id="game"><option>BGMI</option><option>Free Fire MAX</option><option>PUBG</option><option>Valorant</option></select>
<label>Player ID / UID</label>
<input id="pid" placeholder="5123456789">
<label>Ban Reason</label>
<input id="reason" placeholder="Ex: Third party plugin">

<button onclick="make()">GENERATE LETTER - FREE</button>

<div id="out" class="out"></div>
<button id="copyBtn" style="display:none;background:#00c853" onclick="copyL()">COPY LETTER</button>

<div style="margin-top:18px;text-align:center">
<a href="https://www.youtube.com/@theredeye" target="_blank"><button style="background:#222;border:1px solid #ff0000">📺 Full Unban Video</button></a>
<a href="https://buymeacoffee.com/" target="_blank"><button style="background:#ffcc00;color:#000">☕ Support - UPI / Coffee</button></a>
<p style="font-size:10px;color:#555;margin-top:10px">Note: Ye tool aapka data save nahi karta. 100% Safe.</p>
</div>
</div>

<script>
function make(){
let pid=document.getElementById('pid').value.trim();
let game=document.getElementById('game').value;
let reason=document.getElementById('reason').value.trim()||"Not specified";
if(pid.length<4){alert("Sahi ID daalo bhai");return;}
let letter=`Subject: Request for Account Review - ${game} ID: ${pid}

Respected ${game} Support Team,

My account [${pid}] has been banned for [${reason}]. I respectfully request a manual review.

I am a genuine player and I have never used any hack or third-party tool. Please check my logs and consider unbanning my account.

Thank you,
A Loyal ${game} Player
Player ID: ${pid}
Date: ${new Date().toLocaleDateString()}`;

document.getElementById('out').style.display='block';
document.getElementById('out').innerText=letter;
document.getElementById('copyBtn').style.display='block';
}
function copyL(){
navigator.clipboard.writeText(document.getElementById('out').innerText);
alert("Copied! Krafton support pe paste kar do.");
}
</script>
</body>
</html>
