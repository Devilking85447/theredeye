<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aadhaar Photo Maker 20KB 50KB 100KB - theredeye.co.in</title><meta name="description" content="Aadhaar Photo Size Maker 20KB 50KB 100KB by Praveen Bansal - Govt Form Photo Resizer"><style>body{margin:0;background:#000;color:#fff;font-family:monospace;padding:12px}h1{color:#ff0f0f;text-align:center;text-shadow:0 0 15px #ff0f0f}.box{border:1px solid #ff0f0f;border-radius:12px;padding:15px;max-width:600px;margin:15px auto;background:rgba(20,0,0,.9)}input,select,button{width:100%;padding:10px;margin:6px 0;background:#000;border:1px solid #ff0f0f;color:#fff;border-radius:6px;box-sizing:border-box}button{background:#ff0f0f;color:#000;font-weight:900;cursor:pointer}canvas{max-width:100%;border:1px solid #333;margin:10px 0}#out{color:#0f0;white-space:pre-wrap;font-size:11px}</style></head><body>
<h1>AADHAAR PHOTO MAKER</h1>
<p style="text-align:center;color:#aaa;font-size:10px">20KB | 50KB | 100KB - Govt Form Size - theredeye.co.in</p>
<div class="box">
<input type="file" id="file" accept="image/*">
<select id="size"><option value="20">20KB - Aadhaar / Signature</option><option value="50" selected>50KB - Govt Jobs</option><option value="100">100KB - Passport</option><option value="200">200KB - High Quality</option></select>
<select id="dim"><option value="213,213">213x213 (Aadhaar 3.5x3.5cm)</option><option value="300,400" selected>350x450 (Passport 3.5x4.5cm)</option><option value="400,400">400x400 Square</option></select>
<button onclick="make()">MAKE PHOTO</button>
<canvas id="c"></canvas>
<div id="out"></div>
<button id="dl" style="display:none" onclick="download()">DOWNLOAD PHOTO</button>
</div>
<a href="../" style="color:#ff0f0f;display:block;text-align:center;margin:20px">← Back to THEREDEYE.CO.IN</a>
<script>
let img=new Image(); let loaded=false;
document.getElementById('file').onchange=e=>{
 let f=e.target.files[0]; if(!f)return;
 let r=new FileReader(); r.onload=ev=>{img.onload=()=>{loaded=true; document.getElementById('out').innerText='Loaded: '+f.name}; img.src=ev.target.result}; r.readAsDataURL(f);
}
function make(){
 if(!loaded)return alert('Photo select karo');
 let targetKB=parseInt(document.getElementById('size').value);
 let d=document.getElementById('dim').value.split(','); let W=parseInt(d[0]), H=parseInt(d[1]);
 let c=document.getElementById('c'); c.width=W; c.height=H;
 let ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
 // center crop
 let ratio=Math.max(W/img.width, H/img.height); let nw=img.width*ratio, nh=img.height*ratio;
 ctx.drawImage(img,(W-nw)/2,(H-nh)/2,nw,nh);
 // compress to target KB
 let q=0.9; let data=c.toDataURL('image/jpeg',q);
 while(data.length/1024 > targetKB*1.4 && q>0.1){ q-=0.05; data=c.toDataURL('image/jpeg',q); }
 // draw again with quality
 let finalImg=new Image(); finalImg.onload=()=>{
   c.getContext('2d').clearRect(0,0,W,H); c.getContext('2d').fillStyle='#fff'; c.getContext('2d').fillRect(0,0,W,H);
   c.getContext('2d').drawImage(finalImg,0,0);
   document.getElementById('out').innerText='Ready: '+W+'x'+H+' | ~'+Math.round(data.length/1024)+'KB | Target: '+targetKB+'KB\nQuality: '+Math.round(q*100)+'%';
   document.getElementById('dl').style.display='block';
   c.dataset.url=data;
 };
 finalImg.src=data;
}
function download(){
 let a=document.createElement('a'); a.href=document.getElementById('c').dataset.url; a.download='aadhaar-photo-'+document.getElementById('size').value+'kb.jpg'; a.click();
}
</script></body></html>
