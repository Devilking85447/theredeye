<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const cfg={apiKey:"AIzaSyAE0gpHzcFlWtJsh8L6PPobJrQd2EhMfJ0",authDomain:"theredeye-village.firebaseapp.com",databaseURL:"https://theredeye-village-default-rtdb.firebaseio.com",projectId:"theredeye-village",storageBucket:"theredeye-village.firebasestorage.app",messagingSenderId:"1009539974986",appId:"1:1009539974986:web:cbf897f24a92399dd1e3b3"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getDatabase(app);const storage=getStorage(app);await setPersistence(auth,browserLocalPersistence);
let myEmail="",myId="",posts=[],reels=[],chats=[],notifs=[],follows={},realStories=[],view="home",ct="post",curPost=null,pc=null,localStream=null,remoteId=null,callType="video",incomingData=null,myProfile={},sharePostId=null,allProfiles={};

const urlParams=new URLSearchParams(location.search);const refId=urlParams.get('ref');if(refId){localStorage.setItem('wvt_ref',refId); push(ref(db,'wvt_referrals'),{ref:refId,time:Date.now(),newEmail:'visit'});}

async function compressImage(file){return new Promise((res)=>{if(!file||file.type.startsWith('video')){res(file);return;}const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const canvas=document.createElement('canvas');const max=1024;let w=img.width,h=img.height;if(w>h){if(w>max){h*=max/w;w=max;}}else{if(h>max){w*=max/h;h=max;}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);canvas.toBlob((blob)=>{res(new File([blob],file.name,{type:'image/jpeg'}));},'image/jpeg',0.7);};img.src=url;});}

document.getElementById('saveProfileBtn').onclick=async()=>{const name=document.getElementById('editName').value.trim(); const village=document.getElementById('editVillage').value.trim(); const bio=document.getElementById('editBio').value.trim(); const verified=document.getElementById('editVerified').checked; if(verified && !myEmail.includes('theredeye')){ alert('Only Admin can give Green Tick'); return; } await update(ref(db,'wvt_profiles/'+myId),{name, village, bio, email:myEmail, verified, followers: myProfile.followers||0}); closeM(); renderProfile();};
}
function setA(id){document.querySelectorAll('.bottom span').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showS(){document.getElementById('searchWrap').style.display='block'}function hideS(){document.getElementById('searchWrap').style.display='none'}
window.openCreate=()=>{document.getElementById('createModal').classList.add('show');};window.switchT=(t)=>{ct=t;['Post','Story','Reel'].forEach(x=>{document.getElementById('t'+x).style.background=x.toLowerCase()===t?'#0095f6':'#363636';document.getElementById('box'+x).style.display=x.toLowerCase()===t?'block':'none';});};
function setupMedia(){
async function handleMedia(file,type){ if(!file) return; const compressed=await compressImage(file); const isVideo=file.type.startsWith('video'); const localUrl = URL.createObjectURL(file); mediaData[type]=compressed; const edit=document.getElementById('edit'+type.charAt(0).toUpperCase()+type.slice(1)); const img=document.getElementById('img'+type.charAt(0).toUpperCase()+type.slice(1)); const vid=document.getElementById('vid'+type.charAt(0).toUpperCase()+type.slice(1)); edit.style.display='block'; if(isVideo){ vid.src=localUrl; vid.style.display='block'; img.style.display='none'; } else { img.src=localUrl; img.style.display='block'; vid.style.display='none'; } switchT(type); document.getElementById('createModal').classList.add('show');}
document.getElementById('camInput').addEventListener('change',e=>handleMedia(e.target.files[0],'post')); document.getElementById('galInput').addEventListener('change',e=>handleMedia(e.target.files[0],'post')); document.getElementById('camInputStory').addEventListener('change',e=>handleMedia(e.target.files[0],'story')); document.getElementById('galInputStory').addEventListener('change',e=>handleMedia(e.target.files[0],'story')); document.getElementById('camInputReel').addEventListener('change',e=>handleMedia(e.target.files[0],'reel')); document.getElementById('galInputReel').addEventListener('change',e=>handleMedia(e.target.files[0],'reel')); document.getElementById('galBtn').onclick=()=>document.getElementById('galInput').click(); document.getElementById('camBtn').onclick=()=>document.getElementById('camInput').click(); document.getElementById('galBtnStory').onclick=()=>document.getElementById('galInputStory').click(); document.getElementById('camBtnStory').onclick=()=>document.getElementById('camInputStory').click(); document.getElementById('galBtnReel').onclick=()=>document.getElementById('galInputReel').click(); document.getElementById('camBtnReel').onclick=()=>document.getElementById('camInputReel').click();
}
function formatText(t){ if(!t) return ''; let h=esc(t); h=h.replace(/#(\w+)/g,'<span class="tag" onclick="searchTag(\'$1\')">#$1</span>'); return h; }
window.searchTag=(tag)=>{view='search';setA('bSearch');showS();document.getElementById('searchInput').value='#'+tag;renderSearch('#'+tag);};
window.searchLoc=(loc)=>{view='search';setA('bSearch');showS();document.getElementById('searchInput').value=loc;renderSearch(loc);};
function renderHome(){if(!posts.length){contentEl.innerHTML='<div style="text-align:center;color:#777;padding:80px 20px">No posts yet.</div>';return;}contentEl.innerHTML=posts.map(p=>{const liked=p.likes&&p.likes[myId];const saved=p.saved&&p.saved[myId];const hasMedia=p.media&&p.media.length>10; const tick=getTick(p.email); return `<div class="post"><div class="phead"><div class="l"><div class="av">${p.email[0].toUpperCase()}</div><div><div style="font-weight:600;font-size:13px">${esc(p.email.split('@')[0])} ${tick} • ${esc(p.location||'')}</div><div style="font-size:11px;color:#8e8e8e">${new Date(p.time).toLocaleDateString()}</div></div></div><div style="display:flex;gap:10px"><span onclick="toggleFollow('${esc(p.email)}')" style="font-size:12px;color:#0095f6">Follow</span><span onclick="postMenu('${p.id}','${esc(p.email)}')">⋯</span></div></div><div class="pmedia">${hasMedia ? (p.mediaType==='video' ? `<video src="${p.media}" controls></video><div class="overlayText">${esc(p.overlayText||'')}</div>` : `<img src="${p.media}"><div class="overlayText">${esc(p.overlayText||'')}</div>`) : `<div style="padding:20px">${formatText(p.text)}</div>`}</div><div class="pact"><div class="left"><span onclick="toggleLike('${p.id}')" class="${liked?'liked':''}">${liked?'♥':'♡'}</span><span onclick="openCmt('${p.id}')">💬</span><span onclick="openShare('${p.id}')">↗</span></div><span onclick="toggleSave('${p.id}')">${saved?'■':'□'}</span></div><div class="pinfo"><div class="likes">${p.likeCount||0} likes</div><div><b>${esc(p.email.split('@')[0])} ${tick}</b> <span>${formatText(p.text.substring(0,110))}</span></div><div class="cmt" onclick="openCmt('${p.id}')">View all ${p.commentCount||0}</div></div></div>`}).join('');}
function renderSearch(q){const f=q?posts.filter(p=>(p.text+p.email).toLowerCase().includes(q.toLowerCase())):posts;contentEl.innerHTML=`<div style="padding:10px;color:#aaa">Results ${f.length}</div>`+f.map(p=>`<div style="padding:12px;border-bottom:1px solid #111"><b>${esc(p.email.split('@')[0])} ${getTick(p.email)}</b> ${formatText(p.text.substring(0,80))}</div>`).join('');}
function renderReels(){
const list=reels.length?reels:posts;
contentEl.innerHTML=`<div id="reelContainer" style="height:calc(100vh - 120px);overflow-y:scroll;scroll-snap-type:y mandatory">
${list.map(r=>`
<div class="reelItem" style="height:calc(100vh - 120px);scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #111">
${r.media ? (r.mediaType==='video' ? `<video src="${r.media}" loop muted playsinline class="reelVideo" style="width:100%;height:100%;object-fit:cover"></video>` : `<img src="${r.media}" style="width:100%;height:100%;object-fit:cover">`) : `<div style="padding:20px">${formatText(r.text)}</div>`}
<div style="position:absolute;bottom:60px;left:12px;right:60px;color:#fff;text-shadow:0 1px 6px #000">
<b>@${esc(r.email.split('@')[0])} ${getTick(r.email)}</b>
<p style="font-size:13px;margin-top:4px">${formatText(r.text)} ${esc(r.overlayText||'')}</p>
</div>
<div style="position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:20px;text-align:center">
<span onclick="toggleLike('${r.id}')" style="font-size:28px">♡<br><span style="font-size:12px">${r.likeCount||0}</span></span>
<span onclick="openCmt('${r.id}')" style="font-size:28px">💬</span>
<span onclick="openShare('${r.id}')" style="font-size:28px">↗</span>
</div>
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:20px;opacity:0;transition:.3s" class="muteIcon">🔇 Tap for Sound</div>
</div>`).join('')}
</div>`;
const observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const video=entry.target.querySelector('.reelVideo');if(!video) return; if(entry.isIntersecting){ video.play().catch(()=>{}); } else { video.pause(); }});},{threshold:0.6});
document.querySelectorAll('.reelItem').forEach(item=>{
observer.observe(item);
const video=item.querySelector('.reelVideo');
const icon=item.querySelector('.muteIcon');
if(video){
item.addEventListener('click',()=>{ video.muted=!video.muted; if(icon){ icon.style.opacity='1'; icon.innerText=video.muted?'🔇 Muted':'🔊 Sound On'; setTimeout(()=>icon.style.opacity='0',1000);} });
}
});
}
function renderChat(){contentEl.innerHTML=`<div class="chatHead"><b>Village Chat</b><div style="display:flex;gap:8px"><button onclick="startCall('voice')" style="padding:6px 12px;background:#1a1a1a;border:1px solid #262626;border-radius:20px;color:#fff">Voice</button><button onclick="startCall('video')" style="padding:6px 12px;background:#ff2a2a;border:0;border-radius:20px;color:#fff">Video</button></div></div><div id="msgList" style="height:calc(100% - 110px);overflow:auto"></div><div class="chatBar"><input id="chatInput" placeholder="Message..."><button id="chatSend">➤</button></div>`;const list=document.getElementById('msgList');list.innerHTML=chats.map(c=>`<div class="msg ${c.email===myEmail?'me':'other'}"><div style="font-size:10px;color:#aaa">${esc(c.email.split('@')[0])}</div><div>${esc(c.text)}</div></div>`).join('');list.scrollTop=list.scrollHeight;const send=()=>{const i=document.getElementById('chatInput');const t=i.value.trim();if(!t)return;push(ref(db,'village_messages'),{email:myEmail,text:t,time:Date.now()});i.value='';};document.getElementById('chatSend').onclick=send;document.getElementById('chatInput').addEventListener('keypress',e=>{if(e.key==='Enter')send();});}
function renderDM(){contentEl.innerHTML=`<div class="chatHead"><b>DM</b></div><div style="padding:10px"><input id="dmEmail" placeholder="Enter email" style="width:100%;padding:10px;background:#111;border:1px solid #333;border-radius:8px;color:#fff"><div id="dmList" style="margin-top:10px;height:300px;overflow:auto"></div><div class="chatBar"><input id="dmInput" placeholder="Private message..."><button id="dmSend">➤</button></div></div>`; const loadDM=async()=>{const e=document.getElementById('dmEmail').value.trim(); if(!e) return; const dmId=[myId,e.replace(/[^a-zA-Z0-9]/g,'_')].sort().join('_'); const snap=await get(child(ref(db),'wvt_dm/'+dmId)); const msgs=snap.val()||{}; document.getElementById('dmList').innerHTML=Object.values(msgs).map(m=>`<div class="msg ${m.email===myEmail?'me':'other'}">${esc(m.text)}</div>`).join('');}; document.getElementById('dmEmail').addEventListener('change',loadDM); document.getElementById('dmSend').onclick=async()=>{const e=document.getElementById('dmEmail').value.trim(); const t=document.getElementById('dmInput').value.trim(); if(!e||!t) return; const dmId=[myId,e.replace(/[^a-zA-Z0-9]/g,'_')].sort().join('_'); await push(ref(db,'wvt_dm/'+dmId),{email:myEmail,text:t,time:Date.now()}); document.getElementById('dmInput').value=''; loadDM();};}
function renderProfile(){const mine=posts.filter(p=>p.email===myEmail);const p=myProfile||{};const isAdmin=myEmail.includes('theredeye'); const tick=getTick(myEmail,p); contentEl.innerHTML=`<div style="padding:16px"><div style="display:flex;gap:16px;align-items:center"><div style="width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#ff2a2a,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;flex:0 0 86px">${p.photo?`<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover">`:myEmail[0].toUpperCase()}</div><div style="flex:1;display:flex;justify-content:space-around;text-align:center"><div onclick="openFollowList('following')" style="cursor:pointer"><b style="display:block;font-size:18px">${Object.keys(follows).length}</b><span style="font-size:12px">Following</span></div><div><b style="display:block;font-size:18px">${mine.length}</b><span style="font-size:12px">Posts</span></div><div onclick="openFollowList('followers')" style="cursor:pointer"><b style="display:block;font-size:18px">${p.followers||0}</b><span style="font-size:12px">Followers</span></div></div></div><div style="margin-top:12px"><div style="font-weight:700;font-size:15px">${esc(p.name||myEmail.split('@')[0])} ${tick} ${isAdmin?'<span class="verify red">✓ ADMIN</span>':''}</div><div style="font-size:13px;color:#ddd">${esc(p.bio||'WVT Member')}</div><div style="font-size:11px;color:#0f0;margin-top:6px">Ref: ${location.origin+location.pathname}?ref=${myId}</div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="profBtn blueBtn" style="flex:1" onclick="openEditProfile()">Edit</button><button class="profBtn" style="flex:1" onclick="shareProfile()">Share</button></div><div style="display:flex;gap:8px;margin-top:8px"><button class="profBtn" style="flex:1" onclick="logoutWVT()">Log Out</button><button class="profBtn" style="flex:1" onclick="openSettings()">Settings</button></div></div><div class="grid">${mine.map(p=>`<div class="gridItem">${p.media?`<img src="${p.media}">`:esc(p.text.substring(0,24))}</div>`).join('')||'<div style="grid-column:1/4;text-align:center;padding:40px;color:#777">No posts</div>'}</div>`;}
window.openEditProfile=()=>{document.getElementById('editName').value=myProfile.name||'';document.getElementById('editVillage').value=myProfile.village||'Kumharsain';document.getElementById('editBio').value=myProfile.bio||'';document.getElementById('editVerified').checked=myProfile.verified||false;document.getElementById('editProfAvatar').innerHTML=myProfile.photo?`<img src="${myProfile.photo}" style="width:100%;height:100%;object-fit:cover">`:myEmail[0].toUpperCase();document.getElementById('editProfileModal').classList.add('show');};
window.shareProfile=()=>{const url=location.href.split('?')[0]+'?ref='+myId; if(navigator.share) navigator.share({title:'WVT',text:`${myEmail}`,url}); else prompt('Copy:',url);};
window.logoutWVT=async()=>{if(confirm('Logout?')){await signOut(auth); localStorage.removeItem('wvt_email'); location.reload();}};
window.openSettings=()=>{alert('Settings Hard Coded');};
window.toggleFollow=async(email)=>{ if(email===myEmail) return; const fid=email.replace(/[^a-zA-Z0-9]/g,'_'); const r=ref(db,'wvt_follows/'+myId+'/'+fid); const snap=await get(r); if(snap.exists()){ await remove(r); alert('Unfollowed'); } else { await set(r,{email,time:Date.now()}); await update(ref(db,'wvt_profiles/'+fid),{followers: (allProfiles[fid]?.followers||0)+1 }); alert('Followed'); } };
window.openFollowList=async(type)=>{ document.getElementById('followTitle').innerText=type; let html=''; if(type==='following'){ const vals=Object.values(follows); html=vals.map(f=>`<div style="padding:10px;border-bottom:1px solid #111"><b>${esc(f.email.split('@')[0])} ${getTick(f.email)}</b> <span style="float:right;color:#0095f6" onclick="toggleFollow('${esc(f.email)}')">Unfollow</span></div>`).join('')||'<p style="color:#777;padding:20px">No following</p>'; } else { html=`<div style="padding:20px;color:#777">Followers: ${myProfile.followers||0}</div>`; } document.getElementById('followList').innerHTML=html; document.getElementById('followModal').classList.add('show'); };
function renderNotifs(){document.getElementById('notifList').innerHTML=notifs.length?notifs.map(n=>`<div style="padding:10px 0;border-bottom:1px solid #111"><b>${esc(n.from)}</b> ${esc(n.text)}</div>`).join(''):'<p style="text-align:center;color:#777;padding:20px">No notifications</p>';}
window.openShare=(id)=>{sharePostId=id; const refLink=location.origin+location.pathname+'?ref='+myId+'&post='+id; document.getElementById('refLink').innerText=refLink; document.getElementById('shareModal').classList.add('show');};
window.shareWA=()=>{const p=posts.find(x=>x.id===sharePostId); const txt=encodeURIComponent((p?.text||'WVT')+' '+location.origin+location.pathname+'?ref='+myId); window.open('https://wa.me/?text='+txt,'_blank');};
window.shareNative=()=>{const p=posts.find(x=>x.id===sharePostId); const url=location.origin+location.pathname+'?ref='+myId; if(navigator.share){navigator.share({title:'WVT',text:p?.text||'',url});} else {prompt('Copy:',url);} };
window.copyRef=()=>{const url=location.origin+location.pathname+'?ref='+myId; navigator.clipboard.writeText(url).then(()=>alert('Copied'));};
window.doPublish=async()=>{
 let t=""; let overlay=""; if(ct==='post'){ t=document.getElementById('newPost').value.trim(); overlay=document.getElementById('textPost').innerText.trim(); if(overlay==='Add Text') overlay=''; } if(ct==='story'){ t=document.getElementById('newStory').value.trim(); overlay=document.getElementById('textStory').innerText.trim(); } if(ct==='reel'){ t=document.getElementById('newReel').value.trim(); overlay=document.getElementById('textReel').innerText.trim(); }
 if(!t && !mediaData[ct]){ alert('Write something'); return; }
 const btn=document.getElementById('publishBtn'); btn.innerText='Uploading...'; btn.disabled=true;
 let mediaUrl=""; let mediaTypeVal=""; let curMedia=mediaData[ct];
 if(curMedia){ try{ const path=`wvt/${ct}/${myId}_${Date.now()}_${curMedia.name}`; const storageRef=sRef(storage, path); const snap=await uploadBytes(storageRef, curMedia); mediaUrl=await getDownloadURL(snap.ref); mediaTypeVal=curMedia.type.startsWith('video')?'video':'image'; }catch(e){ alert('Upload failed'); btn.innerText='Share'; btn.disabled=false; return; } }
 const loc=document.getElementById('postLoc')?.value.trim()||'Kumharsain';
 const base={email:myEmail,text:t,overlayText:overlay,location:loc,time:Date.now(),likeCount:0,commentCount:0,likes:{},saved:{},media:mediaUrl,mediaType:mediaTypeVal};
 if(ct==='post') await push(ref(db,'wvt_posts'), base);
 if(ct==='story') await push(ref(db,'wvt_stories'), {...base, expire:Date.now()+86400000});
 if(ct==='reel') await push(ref(db,'wvt_reels'), base);
 mediaData={post:null,story:null,reel:null}; ['editPost','editStory','editReel'].forEach(id=>document.getElementById(id).style.display='none'); document.getElementById('newPost').value=''; document.getElementById('newStory').value=''; document.getElementById('newReel').value='';
 btn.innerText='Share'; btn.disabled=false; closeM(); view='home'; setA('bHome'); renderHome();
};
window.toggleLike=async(id)=>{const r=ref(db,'wvt_posts/'+id);let snap=await get(r);if(!snap.exists()){ r=ref(db,'wvt_reels/'+id); snap=await get(r); if(!snap.exists()) return; }const d=snap.val()||{};const likes=d.likes||{};if(likes[myId]){delete likes[myId];d.likeCount=(d.likeCount||1)-1;}else{likes[myId]=true;d.likeCount=(d.likeCount||0)+1;}await update(r,{likes,likeCount:d.likeCount});renderHome(); if(view==='reels') renderReels();};
window.toggleSave=async(id)=>{const r=ref(db,'wvt_posts/'+id);const snap=await get(r);if(!snap.exists()) return;const d=snap.val()||{};const saved=d.saved||{};if(saved[myId])delete saved[myId];else saved[myId]=true;await update(r,{saved});renderHome();};
window.openCmt=(id)=>{curPost=id;document.getElementById('cmtModal').classList.add('show');loadCmt(id);};async function loadCmt(id){const snap=await get(child(ref(db),'wvt_comments/'+id));const list=snap.val()||{};document.getElementById('cmtList').innerHTML=Object.values(list).map(c=>`<div style="padding:8px 0;border-bottom:1px solid #222"><b>${esc(c.email.split('@')[0])} ${getTick(c.email)}</b> ${esc(c.text)}</div>`).join('')||'<p style="color:#777">No comments</p>';}
window.doComment=async()=>{const t=document.getElementById('cmtInput').value.trim();if(!t||!curPost)return;await push(ref(db,'wvt_comments/'+curPost),{email:myEmail,text:t,time:Date.now()});const r=ref(db,'wvt_posts/'+curPost);const snap=await get(r);if(snap.exists())await update(r,{commentCount:(snap.val().commentCount||0)+1});document.getElementById('cmtInput').value='';loadCmt(curPost);};
window.postMenu=async(id,email)=>{const isMe=posts.find(p=>p.id===id)?.email===myEmail;const a=prompt(isMe?'delete / block':'report / block');if(a==='delete'&&isMe){await remove(ref(db,'wvt_posts/'+id)); posts=posts.filter(p=>p.id!==id); renderHome();} if(a?.includes('block')){ await set(ref(db,'wvt_blocks/'+myId+'/'+email.replace(/[^a-zA-Z0-9]/g,'_')),{email,time:Date.now()}); alert('Blocked'); posts=posts.filter(p=>p.email!==email); renderHome(); }};
async function createPC(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate&&remoteId){push(ref(db,`calls/${remoteId}/candidates`),{from:myId,candidate:e.candidate.toJSON()});}};pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];};if(localStream){localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));}}
window.startCall=async(type)=>{remoteId='village_call_'+Date.now();document.getElementById('callScreen').classList.add('show');document.getElementById('callName').innerText='Village Call';try{localStream=await navigator.mediaDevices.getUserMedia({video:type==='video',audio:true});}catch(e){alert('Permission');return;}document.getElementById('localVideo').srcObject=localStream;await createPC();const offer=await pc.createOffer();await pc.setLocalDescription(offer);await set(ref(db,`calls/${remoteId}`),{from:myId,fromEmail:myEmail,offer:{type:offer.type,sdp:offer.sdp},type:type,time:Date.now()});listenForAnswer(remoteId);listenForCandidates(myId);};
function listenForCalls(){onValue(ref(db,`calls/${myId}`),async snap=>{const data=snap.val();if(!data||data.from===myId)return;incomingData=data;remoteId=data.from;document.getElementById('incomingName').innerText=data.fromEmail||data.from;document.getElementById('incomingType').innerText=data.type;document.getElementById('incomingModal').classList.add('show');});}
window.acceptCall=async()=>{document.getElementById('incomingModal').classList.remove('show');document.getElementById('callScreen').classList.add('show');callType=incomingData.type;document.getElementById('callName').innerText=incomingData.fromEmail;try{localStream=await navigator.mediaDevices.getUserMedia({video:callType==='video',audio:true});}catch(e){return;}document.getElementById('localVideo').srcObject=localStream;await createPC();await pc.setRemoteDescription(new RTCSessionDescription(incomingData.offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await update(ref(db,`calls/${remoteId}`),{answer:{type:answer.type,sdp:answer.sdp}});listenForCandidates(myId);};
window.rejectCall=async()=>{document.getElementById('incomingModal').classList.remove('show');if(remoteId)await remove(ref(db,`calls/${myId}`));remoteId=null;};
function listenForAnswer(id){onValue(ref(db,`calls/${id}/answer`),async snap=>{const ans=snap.val();if(ans&&pc&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(ans));}});}
function listenForCandidates(id){onChildAdded(ref(db,`calls/${id}/candidates`),async snap=>{const d=snap.val();if(d.from!==myId&&d.candidate&&pc){try{await pc.addIceCandidate(new RTCIceCandidate(d.candidate));}catch(e){}}});}
window.endCall=async()=>{document.getElementById('callScreen').classList.remove('show');if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}if(pc){pc.close();pc=null;}if(remoteId){await remove(ref(db,`calls/${remoteId}`));await remove(ref(db,`calls/${myId}`));}remoteId=null;};
window.toggleMute=()=>{if(localStream){localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);}};window.toggleVideo=()=>{if(localStream){localStream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);}};
</script>
</body>
