<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WVT - Red Eye Village - FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
.top{height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid #222}
.login{width:92%;max-width:380px;margin:50px auto;background:#111;border:1px solid #222;border-radius:14px;padding:20px;text-align:center}
.login input{width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;border-radius:8px;color:#fff}
.login button{width:100%;padding:12px;border:0;border-radius:8px;color:#fff;font-weight:700;margin-top:8px;cursor:pointer}
#app{display:none;flex:1;flex-direction:column;max-width:600px;margin:0 auto;width:100%;overflow:hidden}
.stories{display:flex;gap:10px;padding:10px;overflow-x:auto;border-bottom:1px solid #222}
.story{flex:0 0 60px;text-align:center}.ring{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#ff2a2a,#ffaa00)}.ring div{width:100%;height:100%;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #000}
.searchWrap{padding:8px;border-bottom:1px solid #222;display:none}.searchWrap input{width:100%;padding:10px;background:#111;border:1px solid #222;border-radius:8px;color:#fff}
.content{flex:1;overflow-y:auto}
.post{border-bottom:1px solid #151515}.phead{padding:10px;display:flex;justify-content:space-between}.postBody{padding:10px 14px;background:#0a0a0a}
.actions{padding:8px 14px;display:flex;gap:16px;font-size:20px}.actions span{cursor:pointer}
#msgList{padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{background:#151515;padding:8px 12px;border-radius:16px;max-width:75%;border:1px solid #222;font-size:14px}.msg.me{align-self:flex-end;background:#ff2a2a}
.chatBar{display:flex;gap:8px;padding:10px;border-top:1px solid #222;background:#000;position:sticky;bottom:0}
.chatBar input{flex:1;padding:12px;background:#111;border:1px solid #222;border-radius:20px;color:#fff}
.chatBar button{padding:10px 14px;background:#ff2a2a;border:0;border-radius:20px;color:#fff;font-weight:700}
.bottom{height:52px;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;background:#000}
.bottom span{font-size:24px;cursor:pointer;opacity:.5}.bottom span.active{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:flex-end;justify-content:center;z-index:99}.modal.show{display:flex}
.sheet{width:100%;max-width:600px;background:#151515;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.sheet textarea{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;margin-top:8px}
.sheet button{width:100%;padding:12px;background:#ff2a2a;border:0;border-radius:8px;color:#fff;font-weight:700;margin-top:8px}
.callScreen{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}.callScreen.show{display:flex}
.callVideos{flex:1;position:relative;background:#000}.callVideos video{width:100%;height:100%;object-fit:cover}
.callVideos #localVideo{position:absolute;width:120px;height:160px;right:14px;bottom:100px;border-radius:12px;border:2px solid #ff2a2a;background:#111;object-fit:cover}
.callInfo{position:absolute;top:20px;left:0;right:0;text-align:center;z-index:10}
.callControls{height:90px;background:#111;border-top:1px solid #222;display:flex;justify-content:center;align-items:center;gap:20px}
.callBtn{width:56px;height:56px;border-radius:50%;border:0;font-size:24px;cursor:pointer}.end{background:#ff2a2a;color:#fff}.mute{background:#333;color:#fff}
</style>
</head>
<body>
<div class="top"><b style="color:#ff2a2a">WVT • RED EYE</b><div><span style="color:#0f0;font-size:11px">● ONLINE</span> <span onclick="doLogout()" style="cursor:pointer;margin-left:10px">⎋</span></div></div>

<div class="login" id="loginBox">
<h3 style="color:#ff2a2a;margin:0">WVT Login</h3><p style="font-size:11px;color:#888;margin:4px 0">One-time code, then ID/Password direct login</p>
<input id="email" type="email" placeholder="Email / User ID"><input id="pass" type="password" placeholder="Password (min 6)">
<button id="loginBtn" style="background:#ff2a2a">Login with ID/Password</button>
<button id="signupBtn" style="background:#222">Create New ID with Code</button>
<button id="resendBtn" style="background:#111;font-size:11px;display:none">Resend Code</button>
<p id="status" style="color:#ffb300;font-size:12px;min-height:16px"></p>
</div>

<div id="app">
<div class="stories" id="stories"></div>
<div class="searchWrap" id="searchWrap"><input id="searchInput" placeholder="Search WVT..."></div>
<div class="content" id="content"></div>
<div class="bottom"><span class="active" id="navHome">⌂</span><span id="navSearch">🔍</span><span id="navAdd">⊞</span><span id="navChat">💬</span><span id="navProf">👤</span></div>
</div>

<div class="modal" id="createModal"><div class="sheet"><h3>Create Post</h3><textarea id="newPost" placeholder="Village update?"></textarea><button id="postBtn">Share</button><button style="background:#222" onclick="closeModals()">Cancel</button></div></div>

<div class="callScreen" id="callScreen">
<div class="callVideos">
<div class="callInfo"><h2 id="callName">Calling...</h2><p id="callStatus">Connecting...</p></div>
<video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video>
</div>
<div class="callControls"><button class="callBtn mute" onclick="toggleMute()">🎤</button><button class="callBtn end" onclick="endCall()">📞</button><button class="callBtn mute" onclick="toggleVideo()">📹</button></div>
</div>

<div class="modal" id="incomingModal"><div class="sheet" style="text-align:center"><h3 id="incomingName">Incoming Call...</h3><p id="incomingType">Voice Call</p><div style="display:flex;gap:16px;margin-top:20px"><button style="flex:1;background:#333;padding:12px;border:0;border-radius:8px;color:#fff" onclick="rejectCall()">Reject</button><button style="flex:1;background:#0f0;padding:12px;border:0;border-radius:8px;color:#000" onclick="acceptCall()">Accept</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {apiKey:"AIzaSyAE0gpHzcFlWtJsh8L6PPobJrQd2EhMfJ0",authDomain:"theredeye-village.firebaseapp.com",databaseURL:"https://theredeye-village-default-rtdb.firebaseio.com",projectId:"theredeye-village",storageBucket:"theredeye-village.firebasestorage.app",messagingSenderId:"1009539974986",appId:"1:1009539974986:web:cbf897f24a92399dd1e3b3"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);
await setPersistence(auth, browserLocalPersistence);
let myEmail="",myId="",posts=[],chats=[],view="home",pc=null,localStream=null,remoteId=null,callType="video",incomingData=null;
const loginBox=document.getElementById('loginBox'),appDiv=document.getElementById('app'),statusEl=document.getElementById('status'),contentEl=document.getElementById('content');
const loginBtn=document.getElementById('loginBtn'),signupBtn=document.getElementById('signupBtn'),resendBtn=document.getElementById('resendBtn');
loginBtn.onclick=async()=>{const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass){statusEl.innerText="Enter ID and Password";return;}statusEl.innerText="Logging in...";try{const c=await signInWithEmailAndPassword(auth,email,pass);if(!c.user.emailVerified){statusEl.innerText="Email not verified, check your code";resendBtn.style.display='block';return;}}catch(e){statusEl.innerText=e.message;}};
signupBtn.onclick=async()=>{const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(pass.length<6){statusEl.innerText="Password must be at least 6 characters";return;}statusEl.innerText="Creating account...";try{const c=await createUserWithEmailAndPassword(auth,email,pass);await sendEmailVerification(c.user);statusEl.innerText="✅ Code sent to email, verify it - then login with ID/Password directly";resendBtn.style.display='block';}catch(e){if(e.code==='auth/email-already-in-use'){statusEl.innerText="This ID already exists, press Login";}else statusEl.innerText=e.message;}};
resendBtn.onclick=async()=>{const u=auth.currentUser;if(u){await sendEmailVerification(u);statusEl.innerText="Code resent";}};
onAuthStateChanged(auth,(u)=>{if(u&&u.emailVerified){myEmail=u.email;myId=u.email.replace(/[^a-zA-Z0-9]/g,'_');loginBox.style.display='none';appDiv.style.display='flex';initApp();listenForCalls();}else if(u&&!u.emailVerified){loginBox.style.display='block';appDiv.style.display='none';statusEl.innerText="Code sent to email, please verify";resendBtn.style.display='block';}else{loginBox.style.display='block';appDiv.style.display='none';}});
window.doLogout=()=>{if(confirm("Logout? You will need to login again with ID/Password")) signOut(auth);};
window.closeModals=()=>document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));
function initApp(){
document.getElementById('stories').innerHTML=["Rahul","Anjali","Village","Praveen","HP","Radio","Kumharsain","Shimla"].map(n=>`<div class="story"><div class="ring"><div>${n[0]}</div></div><div style="font-size:10px;margin-top:4px">${n}</div></div>`).join('');
const rp=ref(db,'wvt_posts');onChildAdded(rp,(s)=>{const d=s.val();d.id=s.key;posts.unshift(d);if(view==='home')renderHome();});
const rc=ref(db,'village_messages');onChildAdded(rc,(s)=>{chats.push(s.val());if(view==='chat')renderChat();});
renderHome();
document.getElementById('navHome').onclick=()=>{view='home';setActive('navHome');hideSearch();renderHome();};
document.getElementById('navSearch').onclick=()=>{view='search';setActive('navSearch');showSearch();renderSearch('');};
document.getElementById('navAdd').onclick=()=>document.getElementById('createModal').classList.add('show');
document.getElementById('navChat').onclick=()=>{view='chat';setActive('navChat');hideSearch();renderChat();};
document.getElementById('navProf').onclick=()=>{view='profile';setActive('navProf');hideSearch();renderProfile();};
document.getElementById('postBtn').onclick=doCreatePost;
document.getElementById('searchInput').addEventListener('input',e=>renderSearch(e.target.value));
}
function setActive(id){document.querySelectorAll('.bottom span').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showSearch(){document.getElementById('searchWrap').style.display='block';}function hideSearch(){document.getElementById('searchWrap').style.display='none';}
function renderHome(){if(posts.length===0){contentEl.innerHTML='<p style="text-align:center;color:#666;padding:40px">No posts - Create first!</p>';return;}contentEl.innerHTML=posts.map(p=>`<div class="post"><div class="phead"><b>${esc(p.email.split('@')[0])}</b><span>⋯</span></div><div class="postBody">${esc(p.text)}</div><div class="actions"><span onclick="this.textContent=this.textContent==='🤍'?'❤️':'🤍'">🤍</span><span>💬</span><span>↗️</span></div></div>`).join('');}
function renderSearch(q){const f=(q||'').toLowerCase();const filtered=f?posts.filter(p=>(p.text+p.email).toLowerCase().includes(f)):posts;contentEl.innerHTML=filtered.map(p=>`<div style="padding:12px;border-bottom:1px solid #222"><b>${esc(p.email.split('@')[0])}</b> ${esc(p.text)}</div>`).join('')||'<p style="text-align:center;color:#666;padding:30px">No result</p>';}
function renderChat(){contentEl.innerHTML=`<div style="padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222"><b>WVT Chat</b><div style="display:flex;gap:8px"><button onclick="startCall('village','voice')" style="padding:6px 12px;background:#222;border:1px solid #333;border-radius:20px;color:#fff;cursor:pointer">📞 Voice</button><button onclick="startCall('village','video')" style="padding:6px 12px;background:#ff2a2a;border:0;border-radius:20px;color:#fff;cursor:pointer">📹 Video</button></div></div><div id="msgList"></div><div class="chatBar"><input id="chatInput" placeholder="Type message..."><button id="chatSend">Send</button></div>`;const list=document.getElementById('msgList');list.innerHTML=chats.map(c=>`<div class="msg ${c.email===myEmail?'me':''}"><div style="font-size:10px;color:#888">${esc(c.email.split('@')[0])}</div>${esc(c.text)}</div>`).join('');const send=()=>{const i=document.getElementById('chatInput');const t=i.value.trim();if(!t)return;push(ref(db,'village_messages'),{email:myEmail,text:t,time:Date.now()});i.value='';};document.getElementById('chatSend').onclick=send;document.getElementById('chatInput').addEventListener('keypress',e=>{if(e.key==='Enter')send();});}
function renderProfile(){contentEl.innerHTML=`<div style="padding:16px"><h3>${esc(myEmail.split('@')[0])} ✓</h3><p style="color:#4a8aff">${esc(myEmail)}</p><p style="color:#888;font-size:12px">ID created once, now always login with ID/Password. Calling only in chat.</p></div>`;}
function doCreatePost(){const t=document.getElementById('newPost').value.trim();if(!t)return;push(ref(db,'wvt_posts'),{email:myEmail,text:t,time:Date.now()});document.getElementById('newPost').value='';closeModals();view='home';setActive('navHome');hideSearch();renderHome();}
async function createPC(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate&&remoteId){push(ref(db,`calls/${remoteId}/candidates`),{from:myId,candidate:e.candidate.toJSON()});}};pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];};if(localStream){localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));}}
window.startCall=async(target,type)=>{callType=type;remoteId=target.replace(/[^a-zA-Z0-9]/g,'_');if(remoteId==='village')remoteId='village_call';document.getElementById('callScreen').classList.add('show');document.getElementById('callName').innerText='Calling '+target;document.getElementById('callStatus').innerText=type==='voice'?'Voice Calling...':'Video Calling...';localStream=await navigator.mediaDevices.getUserMedia({video:type==='video',audio:true});document.getElementById('localVideo').srcObject=localStream;document.getElementById('localVideo').style.display=type==='video'?'block':'none';await createPC();const offer=await pc.createOffer();await pc.setLocalDescription(offer);await set(ref(db,`calls/${remoteId}`),{from:myId,fromEmail:myEmail,offer:{type:offer.type,sdp:offer.sdp},type:type,time:Date.now()});listenForAnswer(remoteId);listenForCandidates(myId);};
function listenForCalls(){const r=ref(db,`calls/${myId}`);onValue(r,async snap=>{const data=snap.val();if(!data||data.from===myId)return;incomingData=data;remoteId=data.from;document.getElementById('incomingName').innerText=data.fromEmail||data.from;document.getElementById('incomingType').innerText=data.type==='voice'?'Voice Call':'Video Call';document.getElementById('incomingModal').classList.add('show');});}
window.acceptCall=async()=>{document.getElementById('incomingModal').classList.remove('show');document.getElementById('callScreen').classList.add('show');callType=incomingData.type;document.getElementById('callName').innerText=incomingData.fromEmail;localStream=await navigator.mediaDevices.getUserMedia({video:callType==='video',audio:true});document.getElementById('localVideo').srcObject=localStream;await createPC();await pc.setRemoteDescription(new RTCSessionDescription(incomingData.offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await update(ref(db,`calls/${remoteId}`),{answer:{type:answer.type,sdp:answer.sdp}});listenForCandidates(myId);document.getElementById('callStatus').innerText='Connected';};
window.rejectCall=async()=>{document.getElementById('incomingModal').classList.remove('show');if(remoteId)await remove(ref(db,`calls/${myId}`));remoteId=null;};
function listenForAnswer(id){const r=ref(db,`calls/${id}/answer`);onValue(r,async snap=>{const ans=snap.val();if(ans&&pc&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(ans));document.getElementById('callStatus').innerText='Connected';}});}
function listenForCandidates(id){const r=ref(db,`calls/${id}/candidates`);onChildAdded(r,async snap=>{const d=snap.val();if(d.from!==myId&&d.candidate&&pc){try{await pc.addIceCandidate(new RTCIceCandidate(d.candidate));}catch(e){}}});}
window.endCall=async()=>{document.getElementById('callScreen').classList.remove('show');if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}if(pc){pc.close();pc=null;}if(remoteId){await remove(ref(db,`calls/${remoteId}`));await remove(ref(db,`calls/${myId}`));}remoteId=null;};
window.toggleMute=()=>{if(localStream){localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);}};
window.toggleVideo=()=>{if(localStream){localStream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);}};
function esc(s){const d=document.createElement('div');d.innerText=s;return d.innerHTML;}
</script>
</body>
</html>
