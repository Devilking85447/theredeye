<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Village Talk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.top{padding:12px 16px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.top h2{margin:0;color:#ff2a2a;font-size:18px}
.login{max-width:380px;margin:80px auto;background:#151515;padding:24px;border-radius:16px;border:1px solid #222;text-align:center}
.login input{width:100%;padding:12px;margin:8px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px}
.login button{width:100%;padding:12px;background:#ff2a2a;border:0;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;margin-top:8px}
.login button:disabled{background:#444}
#chatArea{display:none;flex:1;flex-direction:column;max-width:700px;margin:0 auto;width:100%;border-left:1px solid #222;border-right:1px solid #222}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{background:#151515;padding:10px 12px;border-radius:10px;max-width:80%;border:1px solid #222;word-break:break-word}
.msg.me{align-self:flex-end;background:#2a0a0a;border-color:#ff2a2a}
.bottom{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222}
.bottom input{flex:1;padding:12px;background:#000;color:#fff;border:1px solid #333;border-radius:8px}
.bottom button{padding:12px 18px;background:#ff2a2a;border:0;border-radius:8px;color:#fff;font-weight:bold}
</style>
</head>
<body>

<div class="top">
<h2>RED EYE VILLAGE</h2>
<div style="color:#0f0;font-size:12px">● Worldwide</div>
</div>

<div class="login" id="loginBox">
<h3>Enter Village</h3>
<p style="font-size:13px;color:#aaa">Email daalo, link aayega, click karke andar</p>
<input id="email" placeholder="you@gmail.com" type="email">
<button id="sendLink">Send Login Link</button>
<p id="status" style="color:#ffaa00;font-size:13px;margin-top:12px"></p>
</div>

<div id="chatArea">
<div id="messages"></div>
<div class="bottom">
<input id="msgInput" placeholder="Type message...">
<button id="sendBtn">Send</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAE0gpHzcFlWtJsh8L6PPobJrQd2EhMfJ0",
  authDomain: "theredeye-village.firebaseapp.com",
  databaseURL: "https://theredeye-village-default-rtdb.firebaseio.com",
  projectId: "theredeye-village",
  storageBucket: "theredeye-village.firebasestorage.app",
  messagingSenderId: "1009539974986",
  appId: "1:1009539974986:web:cbf897f24a92399dd1e3b3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const actionCodeSettings = {
  url: window.location.href,
  handleCodeInApp: true
};

const loginBox = document.getElementById('loginBox');
const chatArea = document.getElementById('chatArea');
const status = document.getElementById('status');
const emailInput = document.getElementById('email');

// 1. Send Link
document.getElementById('sendLink').onclick = async () => {
  const email = emailInput.value.trim();
  if(!email.includes('@')){ status.innerText='Sahi email daal'; return; }
  status.innerText='Sending link... Firebase bhej raha hai...';
  try{
    await sendSignInLinkToEmail(auth, email, actionCodeSettings);
    window.localStorage.setItem('emailForSignIn', email);
    status.innerHTML = `<span style="color:#0f0">Link bhej diya! ${email} check karo<br>Inbox / Spam dono dekho</span>`;
  }catch(e){
    status.innerText='Error: '+e.message;
  }
};

// 2. Check if user came from email link
if (isSignInWithEmailLink(auth, window.location.href)) {
  let email = window.localStorage.getItem('emailForSignIn');
  if (!email) {
    email = window.prompt('Apna email confirm karo');
  }
  signInWithEmailLink(auth, email, window.location.href).then((result)=>{
    window.localStorage.removeItem('emailForSignIn');
    loginBox.style.display='none';
    chatArea.style.display='flex';
    startChat(result.user.email);
  }).catch((e)=>{
    status.innerText='Link expire ho gaya, phir se bhejo: '+e.message;
  });
}

function startChat(myEmail){
  const messagesRef = ref(db, 'village_messages');
  const messagesDiv = document.getElementById('messages');
  
  onChildAdded(messagesRef, (snap)=>{
    const data=snap.val();
    const div=document.createElement('div');
    div.className='msg'+(data.email===myEmail?' me':'');
    div.innerHTML=`<div style="font-size:10px;color:#888">${data.email.split('@')[0]} • ${new Date(data.time).toLocaleTimeString()}</div>${data.text}`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop=messagesDiv.scrollHeight;
  });

  const send = ()=>{
    const input=document.getElementById('msgInput');
    const text=input.value.trim();
    if(!text)return;
    push(messagesRef,{email:myEmail,text:text,time:Date.now()});
    input.value='';
  };
  document.getElementById('sendBtn').onclick=send;
  document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
}
</script>
</body>
</html>
