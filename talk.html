<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.top{height:58px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid #262626;background:#000;z-index:20}
.top b{font-family:Georgia,serif;font-size:21px}.top b i{color:#ff2a2a;font-style:normal}
.stories{height:105px;display:flex;gap:18px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid #111;scrollbar-width:none}
.s{flex:0 0 62px;text-align:center;cursor:pointer}.s .ring{width:62px;height:62px;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:flex;align-items:center;justify-content:center;transform:rotate(45deg);border-radius:14px}.s .ring.seen{background:#2a2a2a}.s .ring div{width:100%;height:100%;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;transform:rotate(-45deg);border:2px solid #000}.s p{font-size:10px;margin-top:10px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchWrap{padding:10px;border-bottom:1px solid #111;display:none}.searchWrap input{width:100%;padding:10px 12px;background:#121212;border:1px solid #262626;border-radius:8px;color:#fff;outline:none}
#app{display:none;flex:1;flex-direction:column;max-width:620px;margin:0 auto;width:100%;overflow:hidden;background:#000}
.content{flex:1;overflow-y:auto;padding-bottom:70px;scrollbar-width:none}
.post{border-bottom:1px solid #262626}.phead{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.phead .l{display:flex;gap:10px;align-items:center}.av{width:32px;height:32px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.pmedia{width:100%;aspect-ratio:1/1;background:#0a0a0a;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-top:1px solid #111;border-bottom:1px solid #111}.pmedia img,.pmedia video{width:100%;height:100%;object-fit:cover}.overlayText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;text-align:center;text-shadow:0 2px 12px #000;padding:10px;max-width:90%}
.pact{padding:10px 12px;display:flex;justify-content:space-between;font-size:22px}.pact .left{display:flex;gap:16px}.liked{color:#ff3040}
.pinfo{padding:0 12px 12px;font-size:13px}.likes{font-weight:700}.cmt{color:#8e8e8e;cursor:pointer}.time{font-size:10px;color:#8e8e8e;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.gridItem{aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}.gridItem img{width:100%;height:100%;object-fit:cover}
.bottom{height:50px;border-top:1px solid #262626;background:#000;display:flex;justify-content:space-around;align-items:center;position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:0 auto;z-index:30}
.bottom span{font-size:24px;opacity:.7;cursor:pointer;width:20%;text-align:center}.bottom span.active{opacity:1}.plusBox{width:28px;height:28px;border:1.5px solid #fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto}
.login{width:92%;max-width:380px;margin:50px auto;background:#0a0a0a;border:1px solid #262626;border-radius:12px;padding:22px;text-align:center}
.login input{width:100%;padding:12px;background:#121212;border:1px solid #262626;border-radius:6px;color:#fff;margin:6px 0;outline:none}.login button{width:100%;padding:12px;border:0;border-radius:8px;font-weight:700;margin-top:8px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:flex-end;z-index:100}.modal.show{display:flex}
.sheet{width:100%;max-width:620px;margin:0 auto;background:#1a1a1a;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto;border-top:1px solid #2a2a2a}
.sheet textarea,.sheet input{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;margin:7px 0;outline:none}.sheet button{width:100%;padding:13px;border:0;border-radius:8px;font-weight:700;margin-top:8px;cursor:pointer}.blue{background:#0095f6;color:#fff}.red{background:#ff2a2a;color:#fff}.gray{background:#363636;color:#fff}
.editArea{position:relative;width:100%;aspect-ratio:1/1;background:#0a0a0a;border-radius:12px;overflow:hidden;margin:10px 0;display:none;border:1px solid #222}.editArea img,.editArea video{width:100%;height:100%;object-fit:cover}.dragText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;text-align:center;cursor:move;text-shadow:0 2px 8px #000;min-width:50%;outline:none;border:1px dashed rgba(255,255,255,.4);padding:10px;border-radius:10px;background:rgba(0,0,0,.25)}
.chatHead{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;position:sticky;top:0;background:#000;z-index:5}
#msgList{padding:12px;display:flex;flex-direction:column;gap:8px;height:calc(100% - 110px);overflow:auto}.msg{max-width:76%;padding:10px 12px;border-radius:18px;background:#1e1e1e;font-size:14px}.msg.me{align-self:flex-end;background:#0095f6;border-bottom-right-radius:4px}.msg.other{align-self:flex-start;border-bottom-left-radius:4px}
.chatBar{display:flex;gap:8px;padding:10px;border-top:1px solid #111;background:#000;position:sticky;bottom:0}.chatBar input{flex:1;padding:11px 14px;background:#121212;border:1px solid #262626;border-radius:22px;color:#fff;outline:none}.chatBar button{width:40px;height:40px;border-radius:50%;border:0;background:#ff2a2a;color:#fff;cursor:pointer}
.callScreen{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}.callScreen.show{display:flex}.callVids{flex:1;position:relative}.callVids video{width:100%;height:100%;object-fit:cover}#localVideo{position:absolute;width:110px;height:150px;right:12px;bottom:90px;border-radius:12px;border:2px solid #ff2a2a;background:#111;object-fit:cover}.callInfo{position:absolute;top:30px;left:0;right:0;text-align:center}.callCtr{height:90px;background:#0f0f0f;display:flex;justify-content:center;gap:24px;align-items:center;border-top:1px solid #222}.callBtn{width:54px;height:54px;border-radius:50%;border:0;font-size:20px;cursor:pointer}.end{background:#ff3040;color:#fff}.mute{background:#2a2a2a;color:#fff}
</style>
</head>
<body>
<div class="login" id="loginBox">
<h2 style="font-family:Georgia,serif">WVT • Village</h2><p style="font-size:11px;color:#8e8e8e;margin:6px 0 14px">Email verification required - Login blocked without verification</p>
<input id="email" placeholder="Email / Village ID"><input id="pass" type="password" placeholder="Password min 6 chars">
<button id="loginBtn" class="blue">Log In - Verified Only</button>
<button id="signupBtn" class="gray">Create New ID - Send Verification Code</button>
<button id="resendBtn" class="gray" style="display:none;font-size:11px">Resend Verification Code</button>
<p id="status" style="font-size:12px;color:#ffd60a;margin-top:10px;min-height:16px"></p>
</div>
<div id="app">
<div class="top"><b>WVT <i>•</i> VILLAGE</b><div style="display:flex;gap:14px;font-size:20px;align-items:center"><span id="notifBtn" style="position:relative">♡<span id="notifDot" style="display:none;width:7px;height:7px;background:#ff3040;border-radius:50%;position:absolute;top:0;right:0"></span></span><span id="chatIcon">✉</span><span style="font-size:10px;color:#0f0">LIVE</span></div></div>
<div class="stories" id="stories"></div>
<div class="searchWrap" id="searchWrap"><input id="searchInput" placeholder="Search users, #hashtags, location..."></div>
<div class="content" id="content"></div>
<div class="bottom"><span class="active" id="bHome">⌂</span><span id="bSearch">⌕</span><span id="bCreate"><div class="plusBox">+</div></span><span id="bReels">▶</span><span id="bProf">◎</span></div>
</div>
<div class="modal" id="createModal"><div class="sheet">
<h3>Create - Text on Photo Like Instagram</h3>
<div style="display:flex;gap:8px;margin:10px 0"><button id="tPost" class="blue" style="flex:1">Post</button><button id="tStory" class="gray" style="flex:1">Story 24h</button><button id="tReel" class="gray" style="flex:1">Reel</button></div>
<div id="boxPost"><textarea id="newPost" placeholder="Write caption..."></textarea><div style="display:flex;gap:8px"><button onclick="galInput.click()" class="gray" style="flex:1">🖼️ Gallery</button><button onclick="camInput.click()" class="red" style="flex:1">📷 Camera</button></div><div class="editArea" id="editPost"><img id="imgPost" style="display:none"><video id="vidPost" controls style="display:none"></video><div id="textPost" class="dragText" contenteditable="true">Add Text on Photo</div></div><input id="postLoc" placeholder="Location - Kumharsain"></div>
<div id="boxStory" style="display:none"><div style="display:flex;gap:8px"><button onclick="galInputStory.click()" class="blue" style="flex:1">🖼️ Gallery - Story Opens</button><button onclick="camInputStory.click()" class="gray" style="flex:1">📷 Camera</button></div><div class="editArea" id="editStory"><img id="imgStory" style="display:none"><video id="vidStory" controls style="display:none"></video><div id="textStory" class="dragText" contenteditable="true">Add Text on Story</div></div><textarea id="newStory" placeholder="Story caption"></textarea><label style="font-size:12px"><input type="checkbox" id="closeF"> Close Friends Only</label></div>
<div id="boxReel" style="display:none"><textarea id="newReel" placeholder="Reel caption #WVT"></textarea><div style="display:flex;gap:8px"><button onclick="galInputReel.click()" class="gray" style="flex:1">🖼️ Gallery</button><button onclick="camInputReel.click()" class="red" style="flex:1">📷 Camera</button></div><div class="editArea" id="editReel"><img id="imgReel" style="display:none"><video id="vidReel" controls style="display:none"></video><div id="textReel" class="dragText" contenteditable="true">Add Text on Reel</div></div></div>
<button id="publishBtn" class="red">Share to WVT</button><button class="gray" onclick="closeM()">Cancel</button>
</div></div>
<div class="modal" id="cmtModal"><div class="sheet"><h3>Comments</h3><div id="cmtList"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="cmtInput" placeholder="Add comment..."><button id="cmtSend" class="blue" style="width:70px">Send</button></div><button class="gray" onclick="closeM()" style="margin-top:10px">Close</button></div></div>
<div class="modal" id="notifModal"><div class="sheet"><h3>Notifications</h3><div id="notifList"></div><button class="gray" onclick="closeM()" style="margin-top:10px">Close</button></div></div>
<div class="callScreen" id="callScreen"><div class="callVids"><div class="callInfo"><h2 id="callName">WVT Call</h2><p id="callStatus">Connecting...</p></div><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video></div><div class="callCtr"><button class="callBtn mute" onclick="toggleMute()">🎤</button><button class="callBtn end" onclick="endCall()">✕</button><button class="callBtn mute" onclick="toggleVideo()">📹</button></div></div>
<div class="modal" id="incomingModal"><div class="sheet" style="text-align:center"><h3 id="incomingName">Incoming WVT Call</h3><p id="incomingType">Voice</p><div style="display:flex;gap:10px;margin-top:18px"><button class="gray" style="flex:1" onclick="rejectCall()">Reject</button><button class="blue" style="flex:1;background:#0f0;color:#000" onclick="acceptCall()">Accept</button></div></div></div>
<input type="file" id="camInput" accept="image/*,video/*" capture="environment" style="display:none">
<input type="file" id="galInput" accept="image/*,video/*" style="display:none">
<input type="file" id="camInputStory" accept="image/*,video/*" capture="environment" style="display:none">
<input type="file" id="galInputStory" accept="image/*,video/*" style="display:none">
<input type="file" id="camInputReel" accept="image/*,video/*" capture="environment" style="display:none">
<input type="file" id="galInputReel" accept="image/*,video/*" style="display:none">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, set, onValue, remove, update, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const cfg={apiKey:"AIzaSyAE0gpHzcFlWtJsh8L6PPobJrQd2EhMfJ0",authDomain:"theredeye-village.firebaseapp.com",databaseURL:"https://theredeye-village-default-rtdb.firebaseio.com",projectId:"theredeye-village",storageBucket:"theredeye-village.firebasestorage.app",messagingSenderId:"1009539974986",appId:"1:1009539974986:web:cbf897f24a92399dd1e3b3"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getDatabase(app);await setPersistence(auth,browserLocalPersistence);
let myEmail="",myId="",posts=[],reels=[],stories=[],chats=[],notifs=[],follows={},view="home",ct="post",curPost=null,pc=null,localStream=null,remoteId=null,callType="video",incomingData=null;
let mediaData={post:null,story:null,reel:null}, mediaType={post:'',story:'',reel:''};
email.value=localStorage.getItem('wvt_email')||"";
loginBtn.onclick=async()=>{const e=email.value.trim(),p=pass.value;if(!e||p.length<6){statusEl.innerText="Enter ID and min 6 password";return;}statusEl.innerText="Checking verification...";try{const c=await signInWithEmailAndPassword(auth,e,p);if(!c.user.emailVerified){statusEl.innerText="NOT VERIFIED - Check email and verify - BLOCKED";resendBtn.style.display='block';await signOut(auth);return;}localStorage.setItem('wvt_email',e);statusEl.innerText="Verified - Opening";}catch(er){statusEl.innerText=er.message;}};
signupBtn.onclick=async()=>{const e=email.value.trim(),p=pass.value;if(p.length<6){statusEl.innerText="Password min 6";return;}statusEl.innerText="Sending code...";try{const c=await createUserWithEmailAndPassword(auth,e,p);await sendEmailVerification(c.user);statusEl.innerText="CODE SENT to "+e+" - Open email and verify";resendBtn.style.display='block';}catch(er){statusEl.innerText=er.message;}};
resendBtn.onclick=async()=>{if(auth.currentUser){await sendEmailVerification(auth.currentUser);statusEl.innerText="Code resent";}};
onAuthStateChanged(auth,(u)=>{if(u&&u.emailVerified){myEmail=u.email;myId=u.email.replace(/[^a-zA-Z0-9]/g,'_');loginBox.style.display='none';appDiv.style.display='flex';initAll();listenForCalls();}else if(u&&!u.emailVerified){loginBox.style.display='block';appDiv.style.display='none';statusEl.innerText="Verify email - Login BLOCKED";resendBtn.style.display='block';}else{loginBox.style.display='block';appDiv.style.display='none';}});
window.closeM=()=>document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));
function esc(s){const d=document.createElement('div');d.innerText=s||'';return d.innerHTML;}
function initAll(){
// NO DEMO - Only real stories from Firebase + Add Story diamond
renderStories();
onChildAdded(ref(db,'wvt_posts'),s=>{const d=s.val();d.id=s.key;posts.unshift(d);if(view==='home')renderHome();});
onChildAdded(ref(db,'wvt_reels'),s=>{const d=s.val();d.id=s.key;reels.unshift(d);if(view==='reels')renderReels();});
onChildAdded(ref(db,'wvt_stories'),s=>{const d=s.val();d.id=s.key;if(Date.now() < (d.expire||0)){stories.unshift(d);renderStories();}});
onChildAdded(ref(db,'village_messages'),s=>{chats.push(s.val());if(view==='chat')renderChatMsgs();});
onChildAdded(ref(db,'wvt_notifs/'+myId),s=>{notifs.unshift(s.val());notifDot.style.display='block';});
onValue(ref(db,'wvt_follows/'+myId),snap=>{follows=snap.val()||{};});
renderHome();
bHome.onclick=()=>{view='home';setA('bHome');hideS();renderHome();};bSearch.onclick=()=>{view='search';setA('bSearch');showS();renderSearch('');};bCreate.onclick=()=>openCreate();bReels.onclick=()=>{view='reels';setA('bReels');hideS();renderReels();};bProf.onclick=()=>{view='profile';setA('bProf');hideS();renderProfile();};chatIcon.onclick=()=>{view='chat';renderChat();};notifBtn.onclick=()=>{notifModal.classList.add('show');renderNotifs();notifDot.style.display='none';};
searchInput.addEventListener('input',e=>{if(view==='search')renderSearch(e.target.value);});
tPost.onclick=()=>switchT('post');tStory.onclick=()=>switchT('story');tReel.onclick=()=>switchT('reel');publishBtn.onclick=doPublish;cmtSend.onclick=doComment;
setupMedia();
}
function renderStories(){
// Only real stories - no demo names - diamond shape
let html = `<div class="s" onclick="galInputStory.click()"><div class="ring seen"><div>◊</div></div><p>You</p></div>`;
html += stories.map(s=>`<div class="s" onclick="openStory('${s.email}')"><div class="ring"><div>${esc(s.email[0].toUpperCase())}</div></div><p>${esc(s.email.split('@')[0].substring(0,7))}</p></div>`).join('');
document.getElementById('stories').innerHTML = html;
}
function setA(id){document.querySelectorAll('.bottom span').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showS(){searchWrap.style.display='block'}function hideS(){searchWrap.style.display='none'}
window.openCreate=()=>{createModal.classList.add('show');};window.switchT=(t)=>{ct=t;['Post','Story','Reel'].forEach(x=>{document.getElementById('t'+x).className=x.toLowerCase()===t?'blue':'gray';document.getElementById('box'+x).style.display=x.toLowerCase()===t?'block':'none';});};
function setupMedia(){
function handleMedia(file,type){
 if(!file) return;
 const isVideo=file.type.startsWith('video');
 const reader=new FileReader();
 reader.onload=e=>{
   mediaData[type]=e.target.result; mediaType[type]=isVideo?'video':'image';
   const edit=document.getElementById('edit'+type.charAt(0).toUpperCase()+type.slice(1));
   const img=document.getElementById('img'+type.charAt(0).toUpperCase()+type.slice(1));
   const vid=document.getElementById('vid'+type.charAt(0).toUpperCase()+type.slice(1));
   edit.style.display='block';
   if(isVideo){ vid.src=mediaData[type]; vid.style.display='block'; img.style.display='none'; }
   else { img.src=mediaData[type]; img.style.display='block'; vid.style.display='none'; }
   switchT(type); createModal.classList.add('show');
 };
 reader.readAsDataURL(file);
}
camInput.addEventListener('change',e=>handleMedia(e.target.files[0],'post'));
galInput.addEventListener('change',e=>handleMedia(e.target.files[0],'post'));
camInputStory.addEventListener('change',e=>handleMedia(e.target.files[0],'story'));
galInputStory.addEventListener('change',e=>handleMedia(e.target.files[0],'story'));
camInputReel.addEventListener('change',e=>handleMedia(e.target.files[0],'reel'));
galInputReel.addEventListener('change',e=>handleMedia(e.target.files[0],'reel'));
}
function renderHome(){if(!posts.length){contentEl.innerHTML='<div style="text-align:center;color:#777;padding:80px 20px">No posts yet.<br>Be first to post with Camera/Gallery + Text on Photo<br><br><b style="color:#fff">Tap + to create</b></div>';return;}contentEl.innerHTML=posts.map(p=>{const liked=p.likes&&p.likes[myId];const saved=p.saved&&p.saved[myId];const hasMedia=p.media&&p.media.length>10;return `<div class="post"><div class="phead"><div class="l"><div class="av">${esc(p.email[0].toUpperCase())}</div><div><div style="font-weight:600;font-size:13px">${esc(p.email.split('@')[0])} ✓ • ${esc(p.location||'Kumharsain')}</div><div style="font-size:11px;color:#8e8e8e">${new Date(p.time).toLocaleDateString()}</div></div></div><div onclick="postMenu('${p.id}')">⋯</div></div><div class="pmedia">${hasMedia ? (p.mediaType==='video' ? `<video src="${p.media}" controls></video><div class="overlayText">${esc(p.overlayText||'')}</div>` : `<img src="${p.media}"><div class="overlayText">${esc(p.overlayText||'')}</div>`) : `<div style="padding:20px;text-align:center;white-space:pre-wrap">${esc(p.text)}<div style="font-weight:700;font-size:20px;margin-top:10px">${esc(p.overlayText||'')}</div></div>`}</div><div class="pact"><div class="left"><span onclick="toggleLike('${p.id}')" class="${liked?'liked':''}">${liked?'♥':'♡'}</span><span onclick="openCmt('${p.id}')">💬</span><span onclick="shareP('${p.id}')">↗</span></div><span onclick="toggleSave('${p.id}')">${saved?'■':'□'}</span></div><div class="pinfo"><div class="likes">${p.likeCount||0} likes</div><div><b>${esc(p.email.split('@')[0])}</b> ${esc(p.text).substring(0,110)}</div><div class="cmt" onclick="openCmt('${p.id}')">View all ${p.commentCount||0} comments</div><div class="time">${new Date(p.time).toLocaleString()}</div></div></div>`}).join('');}
function renderSearch(q){const f=q?posts.filter(p=>(p.text+p.email).toLowerCase().includes(q.toLowerCase())):posts;if(!q){contentEl.innerHTML='<div style="padding:10px;color:#8e8e8e;font-size:12px">Explore - Real Posts Only</div><div class="grid">'+posts.map(p=>`<div class="gridItem">${p.media? `<img src="${p.media}">` : esc(p.text.substring(0,28))}</div>`).join('')+'</div>';return;}contentEl.innerHTML=f.map(p=>`<div style="padding:12px;border-bottom:1px solid #111"><b>${esc(p.email.split('@')[0])}</b> ${esc(p.text.substring(0,50))}</div>`).join('');}
function renderReels(){const list=reels.length?reels:posts;if(!list.length){contentEl.innerHTML='<div style="text-align:center;color:#777;padding:80px">No reels yet</div>';return;}contentEl.innerHTML=`<div class="reelWrap">${list.map(r=>`<div class="reel"><div style="flex:1"><b>@${esc(r.email.split('@')[0])}</b><p>${esc(r.text)}</p>${r.media? `<img src="${r.media}" style="max-width:100%;border-radius:10px;margin-top:10px"><div style="font-weight:700">${esc(r.overlayText||'')}</div>` : ''}</div></div>`).join('')}</div>`;}
function renderChat(){contentEl.innerHTML=`<div class="chatHead"><b>Village Chat</b><div style="display:flex;gap:8px"><button onclick="startCall('voice')" style="padding:6px 12px;background:#1a1a1a;border:1px solid #262626;border-radius:20px;color:#fff">Voice</button><button onclick="startCall('video')" style="padding:6px 12px;background:#ff2a2a;border:0;border-radius:20px;color:#fff">Video</button></div></div><div id="msgList"></div><div class="chatBar"><input id="chatInput" placeholder="Message..."><button id="chatSend">➤</button></div>`;renderChatMsgs();const send=()=>{const i=document.getElementById('chatInput');const t=i.value.trim();if(!t)return;push(ref(db,'village_messages'),{email:myEmail,text:t,time:Date.now()});i.value='';};chatSend.onclick=send;chatInput.addEventListener('keypress',e=>{if(e.key==='Enter')send();});}
function renderChatMsgs(){const list=document.getElementById('msgList');if(!list)return;list.innerHTML=chats.map(c=>`<div class="msg ${c.email===myEmail?'me':'other'}"><div style="font-size:10px;color:#aaa">${esc(c.email.split('@')[0])}</div><div>${esc(c.text)}</div></div>`).join('');list.scrollTop=list.scrollHeight;}
function renderProfile(){const mine=posts.filter(p=>p.email===myEmail);contentEl.innerHTML=`<div style="padding:16px"><div style="display:flex;gap:16px"><div style="width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#ff2a2a,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700">${myEmail[0].toUpperCase()}</div><div style="display:flex;gap:18px;text-align:center;align-items:center"><div><b>${mine.length}</b><p>Posts</p></div><div><b>${Object.keys(follows).length}</b><p>Following</p></div></div></div></div><div class="grid">${mine.map(p=>`<div class="gridItem">${p.media? `<img src="${p.media}">` : esc(p.text.substring(0,24))}</div>`).join('')||'<div style="grid-column:1/4;text-align:center;padding:40px;color:#777">No posts</div>'}</div>`;}
function renderNotifs(){notifList.innerHTML=notifs.length?notifs.map(n=>`<div style="padding:10px 0;border-bottom:1px solid #111"><b>${esc(n.from)}</b> ${esc(n.text)}</div>`).join(''):'<p style="text-align:center;color:#777;padding:20px">No notifications</p>';}
window.doPublish=()=>{
 let t="", overlay="";
 if(ct==='post'){ t=newPost.value.trim(); overlay=textPost.innerText.trim(); if(overlay==='Add Text on Photo') overlay=''; }
 if(ct==='story'){ t=newStory.value.trim(); overlay=textStory.innerText.trim(); if(overlay==='Add Text on Story') overlay=t; }
 if(ct==='reel'){ t=newReel.value.trim(); overlay=textReel.innerText.trim(); if(overlay==='Add Text on Reel') overlay=''; }
 if(!t && !mediaData[ct]){ alert('Write something or select photo'); return; }
 const loc=postLoc?.value?.trim()||'Kumharsain';
 const data={email:myEmail,text:t,overlayText:overlay,location:loc,time:Date.now(),likeCount:0,commentCount:0,likes:{},saved:{},media:mediaData[ct]||'',mediaType:mediaType[ct]||''};
 if(ct==='post') push(ref(db,'wvt_posts'), data);
 if(ct==='story') push(ref(db,'wvt_stories'), {...data, expire:Date.now()+86400000, closeFriends:closeF.checked});
 if(ct==='reel') push(ref(db,'wvt_reels'), data);
 mediaData[ct]=null; mediaType[ct]=''; 
 ['editPost','editStory','editReel'].forEach(id=>document.getElementById(id).style.display='none');
 newPost.value=newStory.value=newReel.value=''; if(postLoc) postLoc.value='';
 textPost.innerText='Add Text on Photo'; textStory.innerText='Add Text on Story'; textReel.innerText='Add Text on Reel';
 closeM(); view='home'; setA('bHome'); renderHome();
};
window.toggleLike=async(id)=>{const r=ref(db,'wvt_posts/'+id);const snap=await get(r);const d=snap.val()||{};const likes=d.likes||{};if(likes[myId]){delete likes[myId];d.likeCount=(d.likeCount||1)-1;}else{likes[myId]=true;d.likeCount=(d.likeCount||0)+1;if(d.email!==myEmail)push(ref(db,'wvt_notifs/'+d.email.replace(/[^a-zA-Z0-9]/g,'_')),{from:myEmail.split('@')[0],text:'liked your post',time:Date.now()});}await update(r,{likes,likeCount:d.likeCount});const p=posts.find(x=>x.id===id);if(p){p.likes=likes;p.likeCount=d.likeCount;}renderHome();};
window.toggleSave=async(id)=>{const r=ref(db,'wvt_posts/'+id);const snap=await get(r);const d=snap.val()||{};const saved=d.saved||{};if(saved[myId])delete saved[myId];else saved[myId]=true;await update(r,{saved});const p=posts.find(x=>x.id===id);if(p)p.saved=saved;renderHome();};
window.openCmt=(id)=>{curPost=id;cmtModal.classList.add('show');loadCmt(id);};async function loadCmt(id){const snap=await get(child(ref(db),'wvt_comments/'+id));const list=snap.val()||{};cmtList.innerHTML=Object.values(list).map(c=>`<div style="padding:8px 0;border-bottom:1px solid #222"><b>${esc(c.email.split('@')[0])}</b> ${esc(c.text)}</div>`).join('')||'<p style="color:#777">No comments</p>';}
window.doComment=async()=>{const t=cmtInput.value.trim();if(!t||!curPost)return;await push(ref(db,'wvt_comments/'+curPost),{email:myEmail,text:t,time:Date.now()});const r=ref(db,'wvt_posts/'+curPost);const snap=await get(r);if(snap.exists())await update(r,{commentCount:(snap.val().commentCount||0)+1});cmtInput.value='';loadCmt(curPost);renderHome();};
window.toggleFollow=async(email)=>{const fid=email.replace(/[^a-zA-Z0-9]/g,'_');const r=ref(db,'wvt_follows/'+myId+'/'+fid);if(follows[fid]){await remove(r);delete follows[fid];}else{await set(r,true);follows[fid]=true;push(ref(db,'wvt_notifs/'+fid),{from:myEmail.split('@')[0],text:'started following you',time:Date.now()});}alert(follows[fid]?'Following':'Unfollowed');};
window.postMenu=(id)=>{const isMe=posts.find(p=>p.id===id)?.email===myEmail;const a=prompt(isMe?'Type: delete':'Type: report');if(isMe&&a==='delete'){if(confirm('Delete?'))remove(ref(db,'wvt_posts/'+id)).then(()=>{posts=posts.filter(p=>p.id!==id);renderHome();});}};
window.shareP=(id)=>{const t=posts.find(p=>p.id===id)?.text||'WVT post';if(navigator.share)navigator.share({title:'WVT',text:t});else prompt('Copy link:',location.href+'#'+id);};
window.openStory=(n)=>{if(n==='You'){galInputStory.click();}else{const st=stories.find(x=>x.email===n);if(st){alert('Story by '+st.email+' - '+st.text); if(st.media){window.open(st.media,'_blank');}} else {galInputStory.click();}}};
async function createPC(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate&&remoteId){push(ref(db,`calls/${remoteId}/candidates`),{from:myId,candidate:e.candidate.toJSON()});}};pc.ontrack=e=>{remoteVideo.srcObject=e.streams[0];};if(localStream){localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));}}
window.startCall=async(type)=>{if(view!=='chat'){alert('Go to Chat first');view='chat';renderChat();return;}callType=type;remoteId='village_call_'+Date.now();callScreen.classList.add('show');callName.innerText='Village Call';callStatus.innerText=type==='voice'?'Voice Calling...':'Video Calling...';try{localStream=await navigator.mediaDevices.getUserMedia({video:type==='video',audio:true});}catch(e){alert('Camera/Mic permission needed');return;}localVideo.srcObject=localStream;localVideo.style.display=type==='video'?'block':'none';await createPC();const offer=await pc.createOffer();await pc.setLocalDescription(offer);await set(ref(db,`calls/${remoteId}`),{from:myId,fromEmail:myEmail,offer:{type:offer.type,sdp:offer.sdp},type:type,time:Date.now()});listenForAnswer(remoteId);listenForCandidates(myId);};
function listenForCalls(){onValue(ref(db,`calls/${myId}`),async snap=>{const data=snap.val();if(!data||data.from===myId)return;incomingData=data;remoteId=data.from;incomingName.innerText=data.fromEmail||data.from;incomingType.innerText=data.type==='voice'?'Voice Call':'Video Call';incomingModal.classList.add('show');});}
window.acceptCall=async()=>{incomingModal.classList.remove('show');callScreen.classList.add('show');callType=incomingData.type;callName.innerText=incomingData.fromEmail;try{localStream=await navigator.mediaDevices.getUserMedia({video:callType==='video',audio:true});}catch(e){alert('Permission');return;}localVideo.srcObject=localStream;await createPC();await pc.setRemoteDescription(new RTCSessionDescription(incomingData.offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await update(ref(db,`calls/${remoteId}`),{answer:{type:answer.type,sdp:answer.sdp}});listenForCandidates(myId);callStatus.innerText='Connected - WVT Secure';};
window.rejectCall=async()=>{incomingModal.classList.remove('show');if(remoteId)await remove(ref(db,`calls/${myId}`));remoteId=null;};
function listenForAnswer(id){onValue(ref(db,`calls/${id}/answer`),async snap=>{const ans=snap.val();if(ans&&pc&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(ans));callStatus.innerText='Connected - WVT Secure';}});}
function listenForCandidates(id){onChildAdded(ref(db,`calls/${id}/candidates`),async snap=>{const d=snap.val();if(d.from!==myId&&d.candidate&&pc){try{await pc.addIceCandidate(new RTCIceCandidate(d.candidate));}catch(e){}}});}
window.endCall=async()=>{callScreen.classList.remove('show');if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}if(pc){pc.close();pc=null;}if(remoteId){await remove(ref(db,`calls/${remoteId}`));await remove(ref(db,`calls/${myId}`));}remoteId=null;};
window.toggleMute=()=>{if(localStream){localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);}};window.toggleVideo=()=>{if(localStream){localStream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);}};
</script>
